<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132a86"><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>My Owenmore Stats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Owenmore Gaels shared theme: royal blue band + amber accents. Layout: blue header band with badge, one working column of panels. */
:root{
  --bg:#f1f3fa; --surface:#ffffff; --surface2:#ecf0f9; --line:#d3d9ea; --fg:#0f1a3a; --muted:#566079;
  --royal:#1f3fbf; --royal-2:#132a86; --royal-text:#1f3fbf; --royal-soft:#e3e9fb;
  --amber:#f5a800; --amber-ink:#1d1300; --amber-text:#9a6300; --amber-soft:#fff3d6;
  --them:#0d7d72; --good:#16884f; --bad:#cf3a2e; --card-y:#f2c200; --card-r:#cf3a2e; --card-b:#15171d;
  --pitch:#e6ecfb; --pitch-line:#a8b6df; --on-band:#ffffff; --on-band-muted:rgba(255,255,255,.72);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070c1d; --surface:#0f1730; --surface2:#16203f; --line:#26335d; --fg:#e8ecf8; --muted:#98a3c4;
  --royal:#2f52d6; --royal-2:#14246a; --royal-text:#7e9bff; --royal-soft:#18245a;
  --amber:#ffb81f; --amber-ink:#1d1300; --amber-text:#ffc449; --amber-soft:#2e2510;
  --them:#33c4b2; --good:#3fd08a; --bad:#ff6a5e; --card-y:#ffd23f; --card-r:#ff6a5e; --card-b:#d4dae9;
  --pitch:#0c1636; --pitch-line:#33478a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070c1d; --surface:#0f1730; --surface2:#16203f; --line:#26335d; --fg:#e8ecf8; --muted:#98a3c4;
  --royal:#2f52d6; --royal-2:#14246a; --royal-text:#7e9bff; --royal-soft:#18245a;
  --amber:#ffb81f; --amber-ink:#1d1300; --amber-text:#ffc449; --amber-soft:#2e2510;
  --them:#33c4b2; --good:#3fd08a; --bad:#ff6a5e; --card-y:#ffd23f; --card-r:#ff6a5e; --card-b:#d4dae9;
  --pitch:#0c1636; --pitch-line:#33478a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--royal-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}

/* Header band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(120deg,var(--royal) 0%,var(--royal-2) 85%);color:var(--on-band);border-bottom:4px solid var(--amber)}
.top-in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:8px}
.badge{width:46px;height:46px;border-radius:10px;flex:none;background:var(--amber);color:var(--royal-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.badge img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand .bt{min-width:0;flex:1}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--on-band);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:flex;align-items:center;gap:6px;color:var(--on-band-muted);font-size:13px;margin-top:2px}
.brand a{color:var(--on-band)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:1;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-4px;padding:8px 6px 9px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.07em;text-transform:uppercase;color:var(--on-band-muted);white-space:nowrap}
nav button[aria-current="page"]{color:var(--on-band);border-bottom-color:var(--amber)}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--on-band-muted)}
.ldot[data-s=ok]{background:#46e08f}.ldot[data-s=err]{background:#ff6a5e}.ldot[data-s=wait]{background:var(--amber)}.ldot[data-s=off]{display:none}

/* Page column and panels */
main{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 80px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:0}
.empty{text-align:center;padding:16px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface2);white-space:nowrap}
.chip.w{color:var(--good);border-color:var(--good)} .chip.l{color:var(--bad);border-color:var(--bad)} .chip.d{color:var(--amber-text);border-color:var(--amber)}
.chip.live{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:600;color:var(--fg);text-decoration:none;display:inline-block}
.btn.pri{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.amb{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.armed{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;color:var(--fg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:1 1 140px;min-width:0}
label.f input,label.f select{font-size:15px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.hi{background:var(--royal);color:#fff}.kpi.hi span{color:rgba(255,255,255,.75)}
.kpi.am{background:var(--amber-soft)}.kpi.am b{color:var(--amber-text)}

/* Bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar .trk i{display:block;height:100%;background:var(--royal)}
.bar .trk i.a{background:var(--amber)} .bar .trk i.t{background:var(--them)} .bar .trk i.m{background:var(--line)}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.5em;text-align:right}
.split{display:flex;flex-direction:column;gap:4px}
.split .hd{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.split .hd b{color:var(--fg);font-variant-numeric:tabular-nums}
.split .trk{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface2)}
.split .trk i{display:block;height:100%}
.split .trk i:first-child{background:var(--royal)} .split .trk i:last-child{background:var(--amber)}

/* Pitch */
.pitch{width:100%;max-width:100%;display:block;touch-action:manipulation}
.pitch .grass{fill:var(--pitch)}
.pitch .ln{stroke:var(--pitch-line);stroke-width:1.5;fill:none}
.pitch .arc{stroke:var(--amber);stroke-width:2;fill:none;stroke-dasharray:6 4}
.pitch .l45{stroke:var(--royal-text);stroke-width:3}
.pitch .post{stroke:var(--royal-text);stroke-width:4}
.pitch .lbl{fill:var(--muted);font-size:10px;font-family:var(--body)}
.pitch .dot-s{fill:var(--amber);stroke:var(--royal-2);stroke-width:1.5}
.pitch .dot-g{fill:var(--royal);stroke:var(--amber);stroke-width:2.5}
.pitch .dot-2{fill:var(--amber);stroke:var(--fg);stroke-width:2.5}
.pitch .dot-m{fill:var(--surface);stroke:var(--bad);stroke-width:2}
.pitch .mark{fill:var(--amber);stroke:var(--fg);stroke-width:2}
.pkey{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.pkey i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.pkey .s{background:var(--amber);border:1.5px solid var(--royal-2)} .pkey .g{background:var(--royal);border:2px solid var(--amber)} .pkey .two{background:var(--amber);border:2px solid var(--fg)} .pkey .m{background:var(--surface);border:2px solid var(--bad)}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th:first-child{background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .pc{color:var(--muted);font-size:12px;margin-left:4px}

/* Form strip */
.form{display:flex;gap:6px;flex-wrap:wrap}
.form span{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:#fff}
.form .W{background:var(--good)} .form .L{background:var(--bad)} .form .D{background:var(--amber);color:var(--amber-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.grid2>*{min-width:0}
/* Player page */
.top-in{padding-block:10px}
main{max-width:660px}
.banner{background:var(--amber-soft);border:1px dashed var(--amber);border-radius:12px;padding:10px 12px;font-size:14px}
label.code{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
label.code input{font-size:24px;letter-spacing:.25em;text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 12px}
.err{color:var(--bad);font-weight:600;margin:0}
.hero{background:linear-gradient(140deg,var(--royal),var(--royal-2));color:#fff;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border-bottom:4px solid var(--amber)}
.hero .who{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero .num{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;width:74px;height:74px;border-radius:14px;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center}
.hero .who b{display:block;font-size:22px;font-weight:600;line-height:1.15}
.hero .who span{color:rgba(255,255,255,.75)}
.hero .season{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .season b{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.hero .season span{color:rgba(255,255,255,.8)}
.game{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.game:first-of-type{border-top:0}
.game .o b{font-weight:600} .game .o span{display:block;font-size:13px;color:var(--muted)}
.game .r{font-family:var(--display);font-size:17px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.game .r span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.game .line{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:2px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.s{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.pill.y{border-color:var(--card-y)} .pill.rd{border-color:var(--card-r)}
.pitchbox{max-width:420px;width:100%;margin:0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.w-W{color:var(--good)} .w-L{color:var(--bad)} .w-D{color:var(--amber-text)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.pick{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;text-align:left;color:var(--fg);min-width:0}
.pick b{font-family:var(--display);font-size:20px;color:var(--royal-text);min-width:1.4em}
.pick span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner a,.foot a{color:var(--royal-text);font-weight:600}
.brand small a{color:var(--on-band);font-weight:600}
</style>

// Normalise a club name for matching: "St. Mary's" -> "st marys", "Calry/St. Joseph's" -> "calry/st josephs"
const norm = (s) => String(s || "").toLowerCase().replace(/[’'`.]/g, "").replace(/\b(gaa|gfc|lgfa|club|cumann)\b/g, "")
  .replace(/[^a-z0-9/ ]+/g, " ").replace(/\s*\/\s*/g, "/").replace(/\s+/g, " ").trim();

// Find the crest for a team name as written on fixtures (amalgamations use the first club).
function crestFor(name) {
  const n = norm(name); if (!n) return null;
  const names = (c) => [c.n, ...(c.a || [])].map(norm);
  for (const c of CRESTS) if (names(c).includes(n)) return c;
  const first = n.split("/")[0].trim();
  for (const c of CRESTS) if (names(c).includes(first)) return c;
  let best = null;
  for (const c of CRESTS) for (const cn of names(c).map((x) => x.split("/")[0].trim()))
    if (cn.length > 3 && (first.startsWith(cn) || cn.startsWith(first)) && (!best || cn.length > best.l)) best = { c, l: cn.length };
  return best ? best.c : null;
}

  for(let i=0;i<ones;i++){const k=R();const src=k<.3?'free':k<.38&&sq.code!=='hurling'?'mark':'play';add(Object.assign({side:'us',type:'point',pid:src==='free'?freeTaker:pid('att'),src},at(src==='free'?18:12,src==='free'?36:38)))}
  // misses
  const sc=g+p,wides=Math.round(sc*.45+R()*3);
  for(let i=0;i<wides;i++){const fr=R()<.25;add(Object.assign({side:'us',type:'wide',pid:fr?freeTaker:pid('att'),src:fr?'free':'play'},at(14,44)))}
  for(let i=0,k=1+Math.floor(R()*3);i<k;i++)add(Object.assign({side:'us',type:'short',pid:pid('att'),src:'play'},at(30,46)));
  for(let i=0,k=Math.floor(R()*3);i<k;i++)add(Object.assign({side:'us',type:'saved',pid:pid('att'),src:'play'},at(6,16)));
  const miss45=Math.floor(R()*3);for(let i=0;i<miss45;i++){t45++;add({side:'us',type:R()<.6?'wide':'short',pid:players[0].id,src:'45',lx:R()<.5?14:66,ly:45})}
  for(let i=0;i<t45+Math.floor(R()*2);i++)add({side:'us',type:'w45',pid:null});
  // possession, restarts, keeper, discipline
  const many=(type,lo,hi,w)=>{for(let i=0,k=lo+Math.floor(R()*(hi-lo+1));i<k;i++)add({side:'us',type,pid:w===null?null:pid(w)})};
  many('tow',7,14,'any');many('tol',5,11,'any');many('fwon',7,13,'att');many('fcon',5,11,'any');many('pass',14,28,'any');
  many('kow',9,16,null);many('kol',2,6,null);many('okw',3,8,null);many('okl',7,12,null);
  for(let i=0,k=1+Math.floor(R()*3);i<k;i++)add({side:'us',type:'save',pid:players[0].id});
  for(let i=0,k=Math.floor(R()*3);i<k;i++)add({side:'us',type:'yellow',pid:pid('any')});
  if(sq.code==='football'&&R()<.3)add({side:'us',type:'black',pid:pid('any')});
  const offs=players.slice(1,15).sort(()=>R()-.5),ons=players.slice(15).sort(()=>R()-.5);
  for(let i=0,k=3+Math.floor(R()*3);i<k&&i<ons.length;i++)ev.push({id:id(),per:2,sec:Math.floor(300+R()*(half*60-400)),side:'us',type:'sub',pid:offs[i].id,onId:ons[i].id});

  for(let i=0;i<otwo;i++)add({side:'them',type:'two'});
  for(let i=0;i<op-2*otwo;i++)add({side:'them',type:'point'});
  for(let i=0,k=Math.round((og+op)*.5+R()*3);i<k;i++)add({side:'them',type:'wide'});
  for(let i=0,k=Math.floor(R()*3);i<k;i++)add({side:'them',type:'yellow'});

const DM_LABEL={goal:'Goal',point:'Point',two:'2-pointer',wide:'Wide',short:'Dropped short',saved:'Saved / blocked',penmiss:'Penalty missed',pass:'Pass',tow:'Turnover won',tol:'Turnover lost',fwon:'Free won',fcon:'Free conceded',kow:'Own kick-out won',kol:'Own kick-out lost',okw:'Opp kick-out won',okl:'Opp kick-out lost',w45:'45 won',save:'Save',pensave:'Penalty saved',yellow:'Yellow card',black:'Black card',red:'Red card',sub:'Substitution'};
const DM_PTS={goal:3,point:1,two:2},DM_SHOTS=['goal','point','two','wide','short','saved','penmiss'],DM_SRC={free:'Free','45':'45',pen:'Penalty',mark:'Mark'};
const dmLabel=(t,code)=>{const l=DM_LABEL[t]||t;return code==='hurling'?l.replace('45 won','65 won').replace('kick-out','puck-out'):l};

function dmTally(r,e,m){if(e.type in r)r[e.type]++;
  if(DM_SHOTS.includes(e.type)){if(e.src==='45'){r.t45++;if(DM_PTS[e.type])r.s45++}if(e.type==='two'||dmOutside(e,m))r.twoAtt++}

function dmSummary(m,side){const r=dmBlank();for(const e of m.events)if(e.side===side)dmTally(r,e,m);
  return{scores:r.goal+r.point+r.two,shots:DM_SHOTS.reduce((a,t)=>a+r[t],0),wide:r.wide,tow:r.tow,tol:r.tol,kow:r.kow,kol:r.kol,okw:r.okw,okl:r.okl,fwon:r.fwon,fcon:r.fcon,y:r.yellow,b:r.black,r:r.red,pass:r.pass,save:r.save+r.pensave}}

    score:{us:dmScore(m,'us'),them:dmScore(m,'them')},stats:{us:dmSummary(m,'us'),them:dmSummary(m,'them')},
    events:m.events.map(e=>({per:e.per,sec:e.sec,side:e.side,type:e.type,label:dmLabel(e.type,m.code),pts:DM_PTS[e.type]||0,src:e.src&&e.src!=='play'?(e.src==='45'&&m.code==='hurling'?'65':DM_SRC[e.src]):null,

function demoPlayer(S,code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  let team,player;for(const t of S.teams){const p=t.players.find(x=>x.code===code);if(p){team=t;player=p;break}}
  if(!player)return null;
  const total=dmBlank(),games=[],shots=[];
  for(const m of S.matches.filter(x=>x.teamId===team.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)))){
    const line=dmBlank();let inv=false;
    for(const e of m.events){if(e.side!=='us')continue;
      if(e.type==='sub'){if(e.pid===player.id){line.subOff++;inv=true}if(e.onId===player.id){line.subOn++;inv=true}continue}
      if(e.pid===player.id){dmTally(line,e,m);inv=true;if(DM_SHOTS.includes(e.type)&&typeof e.lx==='number')shots.push({type:e.type,src:e.src||'play',lx:e.lx,ly:e.ly})}}
    if(!inv)continue;for(const k in line)total[k]+=line[k];
    const fx=S.fixtures.find(f=>f.id===m.fixtureId);
    games.push({date:m.date,opp:m.opp,comp:fx?fx.comp:'',result:{us:dmScore(m,'us'),them:dmScore(m,'them')},final:(m.clock||{}).period==='FT',line});
  }
