<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132a86"><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Owenmore Gaels Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Owenmore Gaels shared theme: royal blue band + amber accents. Layout: blue header band with badge, one working column of panels. */
:root{
  --bg:#f1f3fa; --surface:#ffffff; --surface2:#ecf0f9; --line:#d3d9ea; --fg:#0f1a3a; --muted:#566079;
  --royal:#1f3fbf; --royal-2:#132a86; --royal-text:#1f3fbf; --royal-soft:#e3e9fb;
  --amber:#f5a800; --amber-ink:#1d1300; --amber-text:#9a6300; --amber-soft:#fff3d6;
  --them:#0d7d72; --good:#16884f; --bad:#cf3a2e; --card-y:#f2c200; --card-r:#cf3a2e; --card-b:#15171d;
  --pitch:#e6ecfb; --pitch-line:#a8b6df; --on-band:#ffffff; --on-band-muted:rgba(255,255,255,.72);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070c1d; --surface:#0f1730; --surface2:#16203f; --line:#26335d; --fg:#e8ecf8; --muted:#98a3c4;
  --royal:#2f52d6; --royal-2:#14246a; --royal-text:#7e9bff; --royal-soft:#18245a;
  --amber:#ffb81f; --amber-ink:#1d1300; --amber-text:#ffc449; --amber-soft:#2e2510;
  --them:#33c4b2; --good:#3fd08a; --bad:#ff6a5e; --card-y:#ffd23f; --card-r:#ff6a5e; --card-b:#d4dae9;
  --pitch:#0c1636; --pitch-line:#33478a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070c1d; --surface:#0f1730; --surface2:#16203f; --line:#26335d; --fg:#e8ecf8; --muted:#98a3c4;
  --royal:#2f52d6; --royal-2:#14246a; --royal-text:#7e9bff; --royal-soft:#18245a;
  --amber:#ffb81f; --amber-ink:#1d1300; --amber-text:#ffc449; --amber-soft:#2e2510;
  --them:#33c4b2; --good:#3fd08a; --bad:#ff6a5e; --card-y:#ffd23f; --card-r:#ff6a5e; --card-b:#d4dae9;
  --pitch:#0c1636; --pitch-line:#33478a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--royal-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}

/* Header band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(120deg,var(--royal) 0%,var(--royal-2) 85%);color:var(--on-band);border-bottom:4px solid var(--amber)}
.top-in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:8px}
.badge{width:46px;height:46px;border-radius:10px;flex:none;background:var(--amber);color:var(--royal-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.badge img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand .bt{min-width:0;flex:1}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--on-band);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:flex;align-items:center;gap:6px;color:var(--on-band-muted);font-size:13px;margin-top:2px}
.brand a{color:var(--on-band)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:1;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-4px;padding:8px 6px 9px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.07em;text-transform:uppercase;color:var(--on-band-muted);white-space:nowrap}
nav button[aria-current="page"]{color:var(--on-band);border-bottom-color:var(--amber)}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--on-band-muted)}
.ldot[data-s=ok]{background:#46e08f}.ldot[data-s=err]{background:#ff6a5e}.ldot[data-s=wait]{background:var(--amber)}.ldot[data-s=off]{display:none}

/* Page column and panels */
main{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 80px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:0}
.empty{text-align:center;padding:16px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface2);white-space:nowrap}
.chip.w{color:var(--good);border-color:var(--good)} .chip.l{color:var(--bad);border-color:var(--bad)} .chip.d{color:var(--amber-text);border-color:var(--amber)}
.chip.live{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:600;color:var(--fg);text-decoration:none;display:inline-block}
.btn.pri{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.amb{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.armed{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;color:var(--fg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:1 1 140px;min-width:0}
label.f input,label.f select{font-size:15px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.hi{background:var(--royal);color:#fff}.kpi.hi span{color:rgba(255,255,255,.75)}
.kpi.am{background:var(--amber-soft)}.kpi.am b{color:var(--amber-text)}

/* Bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar .trk i{display:block;height:100%;background:var(--royal)}
.bar .trk i.a{background:var(--amber)} .bar .trk i.t{background:var(--them)} .bar .trk i.m{background:var(--line)}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.5em;text-align:right}
.split{display:flex;flex-direction:column;gap:4px}
.split .hd{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.split .hd b{color:var(--fg);font-variant-numeric:tabular-nums}
.split .trk{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface2)}
.split .trk i{display:block;height:100%}
.split .trk i:first-child{background:var(--royal)} .split .trk i:last-child{background:var(--amber)}

/* Pitch */
.pitch{width:100%;max-width:100%;display:block;touch-action:manipulation}
.pitch .grass{fill:var(--pitch)}
.pitch .ln{stroke:var(--pitch-line);stroke-width:1.5;fill:none}
.pitch .arc{stroke:var(--amber);stroke-width:2;fill:none;stroke-dasharray:6 4}
.pitch .l45{stroke:var(--royal-text);stroke-width:3}
.pitch .post{stroke:var(--royal-text);stroke-width:4}
.pitch .lbl{fill:var(--muted);font-size:10px;font-family:var(--body)}
.pitch .dot-s{fill:var(--amber);stroke:var(--royal-2);stroke-width:1.5}
.pitch .dot-g{fill:var(--royal);stroke:var(--amber);stroke-width:2.5}
.pitch .dot-2{fill:var(--amber);stroke:var(--fg);stroke-width:2.5}
.pitch .dot-m{fill:var(--surface);stroke:var(--bad);stroke-width:2}
.pitch .mark{fill:var(--amber);stroke:var(--fg);stroke-width:2}
.pkey{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.pkey i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.pkey .s{background:var(--amber);border:1.5px solid var(--royal-2)} .pkey .g{background:var(--royal);border:2px solid var(--amber)} .pkey .two{background:var(--amber);border:2px solid var(--fg)} .pkey .m{background:var(--surface);border:2px solid var(--bad)}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th:first-child{background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .pc{color:var(--muted);font-size:12px;margin-left:4px}

/* Form strip */
.form{display:flex;gap:6px;flex-wrap:wrap}
.form span{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:#fff}
.form .W{background:var(--good)} .form .L{background:var(--bad)} .form .D{background:var(--amber);color:var(--amber-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.grid2>*{min-width:0}
/* Coach app components */
.board{background:linear-gradient(140deg,var(--royal) 0%,var(--royal-2) 100%);color:var(--on-band);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;border-bottom:4px solid var(--amber)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.sb .tn{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;line-height:1.1;text-wrap:balance}
.sb .tn small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--on-band-muted);letter-spacing:0}
.sb .sc{font-family:var(--display);font-weight:700;font-size:clamp(42px,12vw,62px);line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.sb .them .sc{color:#fff}
.sb .tot{color:var(--on-band-muted);font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(38px,11vw,54px);line-height:1;color:#fff;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.22);border-radius:10px;padding:4px 10px}
.clock.paused{opacity:.6}
.per{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-band-muted);margin-top:4px}
.over{font-family:var(--display);font-weight:600;font-size:16px;color:var(--amber);min-height:20px;font-variant-numeric:tabular-nums}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl .btn{padding:13px;font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.board .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.board .btn.run-off{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.board .btn.run-on{background:transparent;border:2px solid #fff;color:#fff}
.board .btn.armed{background:var(--bad)!important}
.board input{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.board .muted,.board label{color:var(--on-band-muted)}
.board .chip{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.alertbar{background:var(--amber);color:var(--amber-ink);border-radius:10px;padding:10px 12px;font-weight:600}
.flash{animation:flash .6s 4}
@keyframes flash{50%{background:#fff}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

.pad{display:flex;flex-direction:column;gap:10px}
.pad.us .ph h2{color:var(--royal-text)} .pad.them .ph h2{color:var(--them)}
.grp{display:flex;flex-direction:column;gap:6px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.key{min-height:56px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--royal-text);font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:4px}
.key small{font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.key:active{transform:scale(.97)}
.key.score{min-height:72px;font-size:22px;background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.key.score small{color:rgba(29,19,0,.7)}
.key.set{border-color:var(--royal);border-width:2px}
.pad.them .key{color:var(--them)}
.pad.them .key.score{background:transparent;border:2px solid var(--them);color:var(--them)}
.pad.them .key.score small{color:var(--muted)}
.key.y{border-color:var(--card-y);color:var(--fg)} .key.y::before,.key.r::before,.key.bk::before{content:"";width:12px;height:16px;border-radius:2px;margin-bottom:3px}
.key.y::before{background:var(--card-y)} .key.r{border-color:var(--card-r);color:var(--fg)} .key.r::before{background:var(--card-r)} .key.bk{border-color:var(--card-b);color:var(--fg)} .key.bk::before{background:var(--card-b)}
.key.sub{border-color:var(--royal);color:var(--royal-text)}

.log{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:76px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface2);border-left:4px solid var(--royal)}
.ev.them{border-left-color:var(--them)}
.ev.sc{border-left-color:var(--amber)}
.ev .t{font-family:var(--display);font-weight:600;color:var(--amber-text);font-variant-numeric:tabular-nums}
.ev .what{min-width:0}
.ev .what span{color:var(--muted);font-size:13px}

.sheet-bg{position:fixed;inset:0;background:rgba(5,10,30,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:780px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;border-top:4px solid var(--amber);padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.where{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;min-height:24px}
.where b{font-family:var(--display);font-size:18px;letter-spacing:.03em}
.pitchbox{max-width:420px;width:100%;margin:0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.pbtn{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;min-height:60px;color:var(--fg)}
.pbtn b{font-family:var(--display);font-size:24px;line-height:1;color:var(--royal-text)}
.pbtn span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pbtn.off{opacity:.4}
.seg.out button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:600;text-align:center;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.cal button{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;padding:0;color:var(--fg)}
.cal button.blank{visibility:hidden}
.cal button.today{border-color:var(--amber);border-width:2px}
.cal button.sel{background:var(--royal);color:#fff;border-color:var(--royal)}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.cal .dots i.p{background:var(--muted)} .cal .dots i.x{background:var(--bad)}
.fx{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:10px;border-radius:12px;background:var(--surface2);align-items:start}
.fx .dt{text-align:center;font-family:var(--display);line-height:1;background:var(--royal);color:#fff;border-radius:10px;padding:6px 0}
.fx .dt b{display:block;font-size:26px;color:var(--amber)}
.fx .dt span{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.fx .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.fx .opp{font-weight:600;font-size:16px}
.fx.cancelled .opp{text-decoration:line-through;color:var(--muted)}
.res{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}

.prow2{display:grid;grid-template-columns:64px 1fr;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.prow2 .pcode{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pcode code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;letter-spacing:.12em;background:var(--royal-soft);color:var(--royal-text);border-radius:6px;padding:3px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--royal-2);color:#fff;padding:8px 14px;border-radius:99px;font-weight:600;z-index:30;font-size:14px;border:2px solid var(--amber);max-width:calc(100% - 32px)}
.login{gap:14px}
.errtxt{color:var(--bad);font-weight:600;margin:0}
.logo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo-row .badge{width:72px;height:72px;font-size:26px}
nav[hidden]{display:none!important}
.sq-table td:first-child{font-weight:600}
.ht{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:5px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.ht.h1{background:var(--royal);border-color:var(--royal);color:#fff}
.ht.h2{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.halfpill{display:inline-block;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;padding:3px 14px;border-radius:8px;background:var(--amber);color:var(--amber-ink);margin-bottom:6px}
.halfpill.h1{background:#fff;color:var(--royal-2)}
.halfpill.ht0{background:rgba(255,255,255,.18);color:#fff}
.clock .sec{font-size:.45em;opacity:.75;vertical-align:.7em;margin-left:2px}
.ev .t{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.ev .t b{font-size:20px;line-height:1}
.crest{width:24px;height:24px;border-radius:5px;object-fit:contain;background:#fff;flex:none;box-shadow:0 0 0 1px var(--line)}
.crest.big{width:46px;height:46px;border-radius:8px;display:block;margin:0 auto 6px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.fx .opp{display:flex;align-items:center;gap:8px}
.chip.src{color:var(--royal-text);border-color:var(--royal)}
.legend a{color:var(--royal-text)}
.brand small a{color:var(--on-band);font-weight:600}
</style>

// Normalise a club name for matching: "St. Mary's" -> "st marys", "Calry/St. Joseph's" -> "calry/st josephs"
const norm = (s) => String(s || "").toLowerCase().replace(/[’'`.]/g, "").replace(/\b(gaa|gfc|lgfa|club|cumann)\b/g, "")
  .replace(/[^a-z0-9/ ]+/g, " ").replace(/\s*\/\s*/g, "/").replace(/\s+/g, " ").trim();

// Find the crest for a team name as written on fixtures (amalgamations use the first club).
function crestFor(name) {
  const n = norm(name); if (!n) return null;
  const names = (c) => [c.n, ...(c.a || [])].map(norm);
  for (const c of CRESTS) if (names(c).includes(n)) return c;
  const first = n.split("/")[0].trim();
  for (const c of CRESTS) if (names(c).includes(first)) return c;
  let best = null;
  for (const c of CRESTS) for (const cn of names(c).map((x) => x.split("/")[0].trim()))
    if (cn.length > 3 && (first.startsWith(cn) || cn.startsWith(first)) && (!best || cn.length > best.l)) best = { c, l: cn.length };
  return best ? best.c : null;
}

/* ========== lookups & maths ========== */
const team=id=>S.teams.find(t=>t.id===id);
const active=()=>S.matches.find(m=>m.id===S.active)||null;
const player=(t,id)=>t&&t.players.find(p=>p.id===id);
const pName=(t,id)=>{const p=player(t,id);return p?('#'+p.num+' '+p.name):''};
function score(m,side){let g=0,p=0;for(const e of m.events){if(e.side!==side)continue;if(e.type==='goal')g++;else if(e.type==='point')p++;else if(e.type==='two')p+=2}return{g,p,t:g*3+p}}
const fmtS=s=>s.g+'-'+pad(s.p);
function blank(){return{goal:0,point:0,two:0,ptsTotal:0,free:0,f45:0,pen:0,wide:0,short:0,saved:0,penmiss:0,pass:0,tow:0,tol:0,fwon:0,fcon:0,kow:0,kol:0,okw:0,okl:0,w45:0,save:0,pensave:0,yellow:0,black:0,red:0,subOn:0,subOff:0,t45:0,s45:0,twoAtt:0,games:new Set()}}
function tally(r,e,mid,m){
  r.games.add(mid);if(typeof r[e.type]==='number')r[e.type]++;
  if(isScore(e.type)){r.ptsTotal+=EV[e.type].pts;if(e.src==='free')r.free++;if(e.src==='45')r.f45++;if(e.src==='pen')r.pen++}
  if(e.src==='45'&&SHOTS.includes(e.type)){r.t45++;if(isScore(e.type))r.s45++}
  if(e.type==='two'||(SHOTS.includes(e.type)&&m&&outsideArc(e,m.code,m.arc)))r.twoAtt++;
  if(e.type==='pensave')r.save++;
}
function teamStats(tid){
  const ms=S.matches.filter(m=>m.teamId===tid);const t=team(tid);
  const rows=new Map(t.players.map(p=>[p.id,Object.assign(blank(),{p})]));const tot=blank();let W=0,D=0,L=0,For=0,Ag=0,P=0;const games=[];
  for(const m of ms){
    for(const e of m.events){if(e.side!=='us')continue;tally(tot,e,m.id,m);
      if(e.type==='sub'){const off=rows.get(e.pid),on=rows.get(e.onId);if(off){off.subOff++;off.games.add(m.id)}if(on){on.subOn++;on.games.add(m.id)}continue}
      const r=rows.get(e.pid);if(r)tally(r,e,m.id,m)}
    const f=S.fixtures.find(x=>x.id===m.fixtureId);
    if(f&&f.status==='played'){P++;const u=score(m,'us'),th=score(m,'them');For+=u.t;Ag+=th.t;const k=u.t>th.t?'W':u.t<th.t?'L':'D';if(k==='W')W++;else if(k==='L')L++;else D++;games.push({m,f,u,th,k})}
  }
  games.sort((a,b)=>a.f.date.localeCompare(b.f.date));
  return{rows:[...rows.values()],tot,W,D,L,For,Ag,P,games,ms};
}
function matchSummary(m,side){const r=blank();for(const e of m.events)if(e.side===side)tally(r,e,m.id,m);return r}
const shots=r=>SHOTS.reduce((a,k)=>a+(r[k]||0),0);
const scores=r=>r.goal+r.point+r.two;

/* ========== server sync ========== */
const sync={busy:false,again:false,timer:null,state:'off',msg:''};
async function api(action,body){
  try{
    const r=await fetch('/api/live',{method:'POST',headers:{'content-type':'application/json','x-pin':auth.pin},body:JSON.stringify(Object.assign({action},body||{}))});
    let data=null;try{data=await r.json()}catch(e){}
    if(!data)return{ok:false,status:404,error:'The club server isn’t set up on this site yet. Sign-in works once the app is on your Netlify site; try the demo below for now.'};
    return{ok:r.ok,status:r.status,data,error:data&&data.error};
  }catch(e){return{ok:false,status:0,error:'No signal'}}
}
function setSync(state,msg){sync.state=state;sync.msg=msg;const d=document.getElementById('livedot');if(d){d.dataset.s=S&&S.mode==='server'?state:'off';d.title=msg}const s=document.getElementById('syncmsg');if(s)s.textContent=msg}
const teamOut=t=>({id:t.id,name:t.name,assoc:t.assoc,grade:t.grade,half:t.half,code:t.code,arc:!!t.arc,names:t.names||'num',players:t.players});
const sigT=t=>JSON.stringify([teamOut(t),S.fixtures.filter(f=>f.teamId===t.id)]);
const sigM=m=>JSON.stringify(m);
function liveClock(m){const c=m.clock;return{period:c.period,running:!!c.running,elapsed:(c.period==='HT'||c.period==='FT')?0:Math.round(elapsed(m)*10)/10}}
function schedule(ms){if(!S||S.mode!=='server'||!auth.pin)return;clearTimeout(sync.timer);sync.timer=setTimeout(pushDirty,ms??600)}
async function pushDirty(){
  if(S.mode!=='server'||!auth.pin)return true;
  if(sync.busy){sync.again=true;return false}
  sync.busy=true;let ok=true;
  const must=async(action,body)=>{const r=await api(action,body);if(!r.ok)throw r;return r};
  try{
    if(isMgr()&&S.sig.club!==S.club){await must('saveClub',{club:S.club});S.sig.club=S.club}
    for(const t of S.teams){
      if(S.sig.t[t.id]===sigT(t))continue;
      const r=await must('saveTeam',{team:teamOut(t),fixtures:S.fixtures.filter(f=>f.teamId===t.id),deleted:S.deletedFx||[]});
      if(r.data&&r.data.team)r.data.team.players.forEach(sp=>{const p=t.players.find(x=>x.id===sp.id);if(p&&p.code!==sp.code)p.code=sp.code});
      S.sig.t[t.id]=sigT(t);
    }
    for(const id of Object.keys(S.sig.t))if(!team(id)){if(isMgr())await must('deleteTeam',{id});delete S.sig.t[id]}
    for(const m of S.matches){const g=sigM(m);if(S.sig.m[m.id]===g)continue;await must('saveMatch',{match:m,live:liveClock(m)});S.sig.m[m.id]=g}
    for(const id of Object.keys(S.sig.m))if(!S.matches.some(m=>m.id===id)){await must('deleteMatch',{id});delete S.sig.m[id]}
    S.deletedFx=[];persist();setSync('ok','Synced '+new Date().toLocaleTimeString('en-IE'));
  }catch(r){
    ok=false;
    if(r.status===401)setSync('err','Your PIN no longer works. Sign out and sign in again.');
    else if(r.status===403||r.status===400)setSync('err',r.error||'The server refused a change.');
    else{setSync('err',(r.status===0?'No signal':(r.error||'Sync failed'))+'. Saved on this phone, retrying.');clearTimeout(sync.timer);sync.timer=setTimeout(pushDirty,10000)}
  }
  sync.busy=false;if(sync.again){sync.again=false;schedule(100)}
  return ok;
}
function applyPull(d){
  const keepTab=S.tab,keepActive=S.active;
  S=emptyState('server');S.role=d.role;S.club=d.club;S.logoVer=d.logoVer||null;S.imports=d.imports||null;S.tab=keepTab||'match';
  S.teams=d.teams.map(t=>normTeam({id:t.id,name:t.name,assoc:t.assoc,grade:t.grade,half:t.half,code:t.code,arc:t.arc,names:t.names||'num',players:t.players||[],hasCoachPin:!!t.hasCoachPin}));
  S.fixtures=d.teams.flatMap(t=>t.fixtures||[]);
  S.matches=d.matches.map(x=>{const{live,savedAt,...m}=x;if(m.clock&&m.clock.running&&live){m.clock.acc=live.elapsed+(d.now-savedAt)/1000;m.clock.since=Date.now()}return m});
  S.active=S.matches.some(m=>m.id===keepActive)?keepActive:null;
  S.sig={club:S.club,t:{},m:{}};S.teams.forEach(t=>S.sig.t[t.id]=sigT(t));S.matches.forEach(m=>S.sig.m[m.id]=sigM(m));
  persist();
}
async function refresh(quiet){
  if(S.mode!=='server')return;
  setSync('wait','Syncing…');
  const pushed=await pushDirty();if(!pushed)return;
  const r=await api('pull');
  if(!r.ok){setSync('err',r.status===401?'Your PIN no longer works. Sign out and sign in again.':(r.error||'Could not load club data')+'.');return}
  applyPull(r.data);render();setSync('ok','Synced '+new Date().toLocaleTimeString('en-IE'));if(!quiet)toast('Up to date');
}

/* ========== clock ========== */
function elapsed(m){const c=m.clock;return c.acc+(c.running?(Date.now()-c.since)/1000:0)}
let audio=null;
function ensureAudio(){try{if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume()}catch(e){}}
function whistle(){
  try{if(audio){const t=audio.currentTime;[0,.35,.7].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=2900;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.28);o.connect(g).connect(audio.destination);o.start(t+d);o.stop(t+d+.3)})}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}
}
let wake=null;
async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
const perLabel=p=>p===0?'Before throw-in':p===1?'1st half':p==='HT'?'Half time':p===2?'2nd half':'Full time';
function clockHTML(m){const c=m.clock;if(c.period==='HT')return 'HT';if(c.period==='FT')return 'FT';const e=elapsed(m);return `${minOf(e,m.half)}<span class="sec">${pad(Math.floor(e)%60)}s</span>`}
function tick(){
  if(!S)return;const m=active();if(!m||S.tab!=='match')return;
  const el=document.getElementById('clk');if(!el)return;
  const c=m.clock,e=elapsed(m),lim=m.half*60;
  el.innerHTML=clockHTML(m);el.classList.toggle('paused',!c.running);
  const ov=document.getElementById('over');if(ov)ov.textContent=(c.period===1||c.period===2)&&e>lim?'Added time: +'+mmss(e-lim):(c.period===1||c.period===2)?mmss(e)+' of '+m.half+':00':'';
  if(c.running&&(c.period===1||c.period===2)&&e>=lim&&!c.alerted[c.period]){
    c.alerted[c.period]=true;persist();whistle();
    const ab=document.getElementById('alertbar');
    if(ab){const w=c.period===1?'Half time':'Full time';ab.hidden=false;ab.textContent=w+' is due ('+m.half+' minutes played). Tap '+w+' when the ref blows.';ab.classList.remove('flash');void ab.offsetWidth;ab.classList.add('flash')}
  }
}

function armed(key){const now=Date.now();if(ui.armed===key&&now-ui.armT<3500){ui.armed=null;return true}ui.armed=key;ui.armT=now;render();setTimeout(()=>{if(ui.armed===key&&Date.now()-ui.armT>=3400){ui.armed=null;render()}},3600);return false}
const A=n=>ui.armed===n?' armed':'';
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1900)}
async function copy(text,okMsg,inputId){try{await navigator.clipboard.writeText(text);toast(okMsg)}catch(e){const i=inputId&&document.getElementById(inputId);if(i){i.focus();i.select()}toast('Selected, copy it')}}

function syncResult(m){const f=S.fixtures.find(x=>x.id===m.fixtureId);if(!f)return;f.result={us:score(m,'us'),them:score(m,'them')};if(m.clock.period==='FT')f.status='played'}
function addEvent(o,note){
  const m=active();if(!m)return;const per=m.clock.period;
  const ev=Object.assign({id:uid(),per,sec:Math.floor(per==='HT'||per==='FT'?0:elapsed(m))},o);
  m.events.push(ev);syncResult(m);save();schedule(150);render();
  const t=team(m.teamId);toast((note?note+' · ':'')+lbl(ev.type,m.code)+(ev.pid?' · '+pName(t,ev.pid):'')+(ev.side==='them'?' · '+m.opp:''));
}
function startMatch(fx){
  const t=team(fx.teamId);
  const m={id:uid(),fixtureId:fx.id,teamId:t.id,opp:fx.opp,date:fx.date,half:t.half,code:t.code,arc:!!t.arc,events:[],clock:{period:0,running:false,acc:0,since:0,alerted:{}}};
  S.matches.push(m);fx.matchId=m.id;fx.status='live';S.active=m.id;S.tab='match';save();render();

function resizeImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const k=Math.min(1,256/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'))};img.src=fr.result};fr.readAsDataURL(file)})}

const acts={
  tab:d=>{S.tab=d.v;persist();render();window.scrollTo(0,0)},

    auth.role=r.data.role;store.set(AUTHKEY,JSON.stringify(auth));store.set(MODEKEY,'server');

  resetDemo:()=>{if(!armed('reset'))return;S=buildDemo();ui.statsTeam=null;ui.squadTeam=null;persist();render();toast('Demo reset to the example season')},
  signout:()=>{
    if(S.mode==='demo'){store.set(MODEKEY,'server');S=(auth.pin&&JSON.parse(store.get(KEY)||'null'))||emptyState('server');S.mode='server';render();if(auth.pin)refresh(true);return}
    const dirty=S.teams.some(t=>S.sig.t[t.id]!==sigT(t))||S.matches.some(m=>S.sig.m[m.id]!==sigM(m));
    if(!armed('signout')){if(dirty)toast('Some changes haven’t synced yet. Tap again to sign out anyway.');return}
    auth={pin:'',role:null};store.del(AUTHKEY);store.del(KEY);S=emptyState('server');ui.loginErr='';setSync('off','');render()},
  refresh:()=>refresh(false),
  run:()=>{const m=active();const c=m.clock;if(c.period==='HT'||c.period==='FT')return;
    if(c.period===0){c.period=1;c.acc=0}
    if(c.running){c.acc=elapsed(m);c.running=false;keepAwake(false)}else{c.since=Date.now();c.running=true;keepAwake(true)}
    save();schedule(100);render()},
  next:()=>{const m=active(),c=m.clock;
    if(c.period===0){acts.run();return}

    else if(c.period==='HT'){c.period=2;c.acc=0;c.since=Date.now();c.running=true;keepAwake(true)}
    else if(c.period===2){if(!armed('next'))return;c.h2=elapsed(m);c.running=false;c.acc=0;c.period='FT';keepAwake(false);syncResult(m)}
    save();schedule(100);render()},
  adj:d=>{const m=active();const c=m.clock;const e=elapsed(m);c.acc=Math.max(0,e+Number(d.v));if(c.running)c.since=Date.now();save();tick()},

/* ========== sheets: shot (with pitch), 45/65, plain player picker ========== */
function closeSheet(){const sh=document.getElementById('sheet');sh.hidden=true;sh.innerHTML='';sh.onclick=null}
function pgridHTML(t,offId){return t.players.length?`<div class="pgrid">${t.players.map(p=>`<button class="pbtn${p.id===offId?' off':''}" data-pid="${p.id}" ${p.id===offId?'disabled':''}><b>${p.num}</b><span>${esc(p.name||'—')}</span></button>`).join('')}</div>`:`<p class="muted">No players in this squad yet. Add them under Squads.</p>`}
function openShot(m,type){
  const t=team(m.teamId);const sh=document.getElementById('sheet');const is45=type==='t45';
  const D=DEPTH(m.code),line=footy(m.code)?45:65;
  let loc=is45?{lx:40,ly:line}:null,src=type==='penmiss'?'pen':is45?'45':'play',out=null;
  const finalType=()=>{
    if(is45)return out==='scored'?(footy(m.code)&&m.arc?'two':'point'):out;
    if(loc&&footy(m.code)&&m.arc&&src!=='pen'){if(type==='point'&&outsideArc(loc,m.code,m.arc))return 'two';if(type==='two'&&!outsideArc(loc,m.code,m.arc))return 'point'}
    return type};
  const draw=()=>{
    const title=is45?(set45(m.code)+' taken'):lbl(type,m.code);
    const ft=finalType();
    let where=is45?`<span>${sideOf(loc)} side of the ${line}m line</span>`:loc?`<span><b>${Math.round(distM(loc))}m</b> · ${BANDS(m.code,m.arc)[bandOf(loc,m.code)]}, ${sideOf(loc).toLowerCase()}</span>`:'<span class="muted">Tap where it was taken from (optional)</span>';
    if(!is45&&ft!==type&&isScore(type))where+=`<span class="chip d">Logged as ${ft==='two'?'2 points':'1 point'}</span>`;
    if(is45&&out==='scored')where+=`<span class="chip d">${ft==='two'?'2 points':'1 point'}</span>`;
    const srcs=is45||type==='penmiss'?[]:Object.keys(SRC).filter(k=>k!=='45'&&!(type==='two'&&k==='pen')&&!(!footy(m.code)&&k==='mark'));
    sh.innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-label="${esc(title)}">
      <div class="row" style="justify-content:space-between"><h2>${esc(title)}</h2><button class="btn sm" data-close="1">Cancel</button></div>
      <div class="where">${where}</div>
      <div class="pitchbox">${pitchSVG({code:m.code,arc:m.arc,mark:loc,hl45:is45,id:'shotpitch',label:'Tap the pitch where the shot was taken'})}</div>
      ${is45?`<div class="grp"><h3>Result</h3><div class="seg out">${[['scored','Scored'],['wide','Wide'],['short','Dropped short']].map(([k,l])=>`<button data-out="${k}" aria-pressed="${out===k}">${l}</button>`).join('')}</div></div>`:''}
      ${srcs.length?`<div class="grp"><h3>From</h3><div class="seg">${srcs.map(k=>`<button data-src="${k}" aria-pressed="${k===src}">${esc(srcL(k,m.code))}</button>`).join('')}</div></div>`:''}
      <div class="grp"><h3>${is45?'Who took it':'Player'}</h3>${pgridHTML(t)}</div>
      <button class="btn" data-pid="">No player / not sure</button>
    </div></div>`;
    const svg=document.getElementById('shotpitch');
    if(svg)svg.addEventListener('click',ev=>{const r=svg.getBoundingClientRect();if(!r.width)return;
      const lx=Math.max(0,Math.min(PW,(ev.clientX-r.left)/r.width*PW)),ly=Math.max(0,Math.min(D,(ev.clientY-r.top)/r.height*D));
      loc=is45?{lx:Math.round(lx*2)/2,ly:line}:{lx:Math.round(lx*2)/2,ly:Math.round(ly*2)/2};draw()});
  };
  draw();sh.hidden=false;
  sh.onclick=e=>{
    if(e.target.dataset.close){closeSheet();return}
    const o=e.target.closest('[data-out]');if(o){out=o.dataset.out;draw();return}
    const s=e.target.closest('[data-src]');if(s){src=s.dataset.src;draw();return}
    const b=e.target.closest('[data-pid]');if(!b)return;
    if(is45&&!out){toast('Pick the result first');return}
    const ft=finalType();const ev={side:'us',type:ft,pid:b.dataset.pid||null,src};if(loc){ev.lx=loc.lx;ev.ly=loc.ly}
    closeSheet();addEvent(ev,is45?set45(m.code):null);
  };
}
function openPlain(m,type){
  const t=team(m.teamId);const sh=document.getElementById('sheet');let step='main',offId=null;
  const draw=()=>{const title=type==='sub'?(step==='main'?'Player coming off':'Player coming on'):lbl(type,m.code);
    sh.innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-label="${esc(title)}">
      <div class="row" style="justify-content:space-between"><h2>${esc(title)}</h2><button class="btn sm" data-close="1">Cancel</button></div>
      ${pgridHTML(t,offId)}${type!=='sub'?'<button class="btn" data-pid="">No player / not sure</button>':''}</div></div>`};
  draw();sh.hidden=false;
  sh.onclick=e=>{
    if(e.target.dataset.close){closeSheet();return}
    const b=e.target.closest('[data-pid]');if(!b)return;const pid=b.dataset.pid||null;
    if(type==='sub'){if(step==='main'){offId=pid;step='on';draw();return}closeSheet();addEvent({side:'us',type:'sub',pid:offId,onId:pid});return}
    closeSheet();addEvent({side:'us',type,pid});
  };
}
/* ========== small chart helpers ========== */
const barRow=(label,v,max,shown,cls)=>`<div class="bar"><span class="lab">${label}</span><span class="trk"><i class="${cls||''}" style="width:${max?Math.max(2,Math.round(v*100/max)):0}%"></i></span><span class="v">${shown??v}</span></div>`;
const splitBar=(title,aL,a,bL,b)=>`<div class="split"><div class="hd"><span>${aL} <b>${a}</b></span><span>${title}</span><span><b>${b}</b> ${bL}</span></div><div class="trk"><i style="width:${a+b?a*100/(a+b):50}%"></i><i style="width:${a+b?b*100/(a+b):50}%"></i></div></div>`;
function formChart(games){
  const g=games.slice(-8);if(!g.length)return '<p class="empty">No results yet.</p>';
  const max=Math.max(...g.map(x=>Math.max(x.u.t,x.th.t)),1),W=320,H=150,bw=W/g.length,base=H-30;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="pitch" role="img" aria-label="Points for and against, last ${g.length} matches">`;
  for(const v of[0,.5,1]){const y=base-v*(base-12);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`}
  g.forEach((x,i)=>{const cx=i*bw+bw/2,hU=x.u.t/max*(base-12),hT=x.th.t/max*(base-12),w=Math.min(16,bw/3);
    s+=`<rect x="${cx-w-1}" y="${base-hU}" width="${w}" height="${hU}" rx="2" fill="var(--royal)"><title>${esc(fmtS(x.u)+' v '+x.m.opp)}</title></rect>`;
    s+=`<rect x="${cx+1}" y="${base-hT}" width="${w}" height="${hT}" rx="2" fill="var(--amber)"><title>${esc(x.m.opp+' '+fmtS(x.th))}</title></rect>`;
    s+=`<text x="${cx-w/2-1}" y="${base-hU-4}" text-anchor="middle" font-size="10" fill="var(--fg)">${x.u.t}</text><text x="${cx+w/2+1}" y="${base-hT-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.th.t}</text>`;
    s+=`<text x="${cx}" y="${H-14}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(x.m.opp.slice(0,9))}</text><text x="${cx}" y="${H-3}" text-anchor="middle" font-size="10" font-weight="700" fill="${x.k==='W'?'var(--good)':x.k==='L'?'var(--bad)':'var(--amber-text)'}">${x.k}</text>`});
  return s+'</svg><div class="pkey"><span><i style="background:var(--royal);border-radius:3px"></i>Us</span><span><i style="background:var(--amber);border-radius:3px"></i>Opposition</span></div>';
}
const pkey=arc=>`<div class="pkey"><span><i class="g"></i>Goal</span><span><i class="s"></i>Point</span>${arc?'<span><i class="two"></i>2-pointer</span>':''}<span><i class="m"></i>Missed</span></div>`;
const shotDots=(list,t)=>list.filter(x=>hasLoc(x.e)).map(x=>({lx:x.e.lx,ly:x.e.ly,cls:dotCls(x.e.type),t:lbl(x.e.type,x.m.code)+(x.e.src&&x.e.src!=='play'?' ('+srcL(x.e.src,x.m.code)+')':'')+(t&&x.e.pid?' · '+pName(t,x.e.pid):'')+' v '+x.m.opp}));

function vMatch(){
  const m=active();
  if(!m){
    const up=S.fixtures.filter(f=>f.status==='upcoming'||f.status==='live').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);
    return `<section class="panel"><h2>Start a match</h2>
      ${up.length?up.map(f=>fxCard(f,true)).join(''):'<p class="muted">No upcoming fixtures. Add them under Fixtures, or start a quick match below.</p>'}</section>
    <section class="panel"><h3>Quick match</h3><div class="row">
      <label class="f">Squad<select id="q-team">${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label>
      <label class="f">Opposition<input id="q-opp" placeholder="e.g. Shamrock Gaels"></label></div>
      <div class="row"><button class="btn pri" data-act="quick">Start match</button></div></section>`;
  }
  const t=team(m.teamId)||{name:'',players:[]};const c=m.clock;const us=score(m,'us'),th=score(m,'them');const F=footy(m.code),two=F&&m.arc,ko=KO(m.code);
  const runLbl=c.period===0?'Throw-in':c.running?'Time off':'Time on';
  const nextLbl=c.period===0?'Start 1st half':c.period===1?(ui.armed==='next'?'Confirm half time':'Half time'):c.period==='HT'?'Start 2nd half':c.period===2?(ui.armed==='next'?'Confirm full time':'Full time'):'Match over';
  const key=(side,type,cls,label,sm)=>`<button class="key ${cls||''}" data-act="ev" data-side="${side}" data-type="${type}">${label}${sm!==undefined&&sm!==''?`<small>${sm}</small>`:''}</button>`;
  const cnt=(side,type)=>m.events.filter(e=>e.side===side&&e.type===type).length;
  const n=(side,type)=>{const x=cnt(side,type);return x?String(x):''};
  const ms=matchSummary(m,'us'),mt=matchSummary(m,'them');
  const t45=m.events.filter(e=>e.side==='us'&&e.src==='45'&&SHOTS.includes(e.type));
  const log=[...m.events].reverse().map(e=>{
    let who=e.side==='them'?esc(m.opp):esc(pName(t,e.pid)||S.club);
    if(e.type==='sub')who=esc((pName(t,e.pid)||'?')+' off → '+(pName(t,e.onId)||'?')+' on');

      <div class="row"><label class="f">Date<input id="e-date-${f.id}" type="date" value="${esc(f.date)}"></label><label class="f">Throw-in<input id="e-time-${f.id}" type="time" value="${esc(f.time||'')}"></label>
      <label class="f">Venue<select id="e-venue-${f.id}">${['Home','Away','Neutral'].map(v=>`<option ${f.venue===v?'selected':''}>${v}</option>`).join('')}</select></label></div>

      <button class="btn sm warn${A('dfx'+f.id)}" data-act="delFx" data-id="${f.id}">${ui.armed==='dfx'+f.id?'Tap to delete':'Delete'}</button></div>

  const list=S.fixtures.filter(f=>ui.teamF==='all'||f.teamId===ui.teamF);const byDay={};list.forEach(f=>{(byDay[f.date]=byDay[f.date]||[]).push(f)});
  let cells='';for(let i=0;i<lead;i++)cells+='<button class="blank" tabindex="-1" aria-hidden="true"></button>';

    ${S.teams.length>1?`<div class="seg"><button data-act="teamF" data-v="all" aria-pressed="${ui.teamF==='all'}">All squads</button>${S.teams.map(t=>`<button data-act="teamF" data-v="${t.id}" aria-pressed="${ui.teamF===t.id}">${esc(t.name)}</button>`).join('')}</div>`:''}

function vStats(){
  if(!S.teams.length)return '<section class="panel"><p class="empty">No squads yet.</p></section>';
  if(!ui.statsTeam||!team(ui.statsTeam))ui.statsTeam=S.teams[0].id;
  const t=team(ui.statsTeam);const st=teamStats(t.id);const T=st.tot;const F=footy(t.code),two=F&&t.arc,ko=KO(t.code),s45=set45(t.code);
  const P=st.P||1;
  // shots, filtered for the map and breakdowns
  const all=[];for(const m of st.ms)for(const e of m.events)if(e.side==='us'&&SHOTS.includes(e.type))all.push({e,m});
  const fl=all.filter(x=>(ui.mapSrc==='all'||(x.e.src||'play')===ui.mapSrc)&&(ui.mapPl==='all'||x.e.pid===ui.mapPl));
  const located=fl.filter(x=>hasLoc(x.e));
  const bands=BANDS(t.code,two).map((l,i)=>{const r=located.filter(x=>bandOf(x.e,x.m.code)===i);return{l,a:r.length,s:r.filter(x=>isScore(x.e.type)).length}});
  const sides=['Left','Centre','Right'].map(l=>{const r=located.filter(x=>sideOf(x.e)===l);return{l,a:r.length,s:r.filter(x=>isScore(x.e.type)).length}});
  const srcs=Object.keys(SRC).filter(k=>F||k!=='mark').map(k=>{const r=all.filter(x=>(x.e.src||'play')===k);return{k,l:srcL(k,t.code),a:r.length,s:r.filter(x=>isScore(x.e.type)).length}}).filter(r=>r.a);
  const maxB=Math.max(1,...bands.map(b=>b.a));
  // 45s
  const f45=all.filter(x=>x.e.src==='45');
  const s45sides=['Left','Centre','Right'].map(l=>{const r=f45.filter(x=>hasLoc(x.e)&&sideOf(x.e)===l);return{l,a:r.length,s:r.filter(x=>isScore(x.e.type)).length}});
  const takers={};f45.forEach(x=>{const k=x.e.pid||'';(takers[k]=takers[k]||{a:0,s:0}).a++;if(isScore(x.e.type))takers[k].s++});
  // players
  const rows=st.rows.filter(r=>r.games.size).sort((a,b)=>b.ptsTotal-a.ptsTotal||b.goal-a.goal||a.p.num-b.p.num);
  const topMax=Math.max(1,...rows.map(r=>r.ptsTotal));
  const sc=r=>`${r.goal}-${pad(r.point+2*r.two)}`;
  const cols=[['G','goal'],['P','point']].concat(two?[['2P','two'],['2P att','twoAtt']]:[]).concat([['Fr','free'],[s45+'s','t45x'],['Pen','pen'],['Wd','wide'],['Sh','short'],['Svd','saved'],['Pass','pass'],['TOW','tow'],['TOL','tol'],['FW','fwon'],['FG','fcon'],['Save','save'],['Y','yellow']]).concat(hasBlack(t.code)?[['B','black']]:[]).concat([['R','red']]);
  const cell=(r,k)=>k==='t45x'?(r.t45?r.s45+'/'+r.t45:''):(r[k]||'');
  const played=S.fixtures.filter(f=>f.teamId===t.id&&f.status==='played').sort((a,b)=>b.date.localeCompare(a.date));
  const form=st.games.slice(-5);
  return `<section class="panel">
    <div class="ph"><h2>${esc(t.name)}</h2><span class="chip">${esc(assocOf(t).l)} · ${esc(t.grade)}</span></div>
    ${S.teams.length>1?`<div class="seg">${S.teams.map(x=>`<button data-act="statsTeam" data-v="${x.id}" aria-pressed="${x.id===t.id}">${esc(x.name)}</button>`).join('')}</div>`:''}
    <div class="kpis">
      <div class="kpi hi"><b>${st.W}-${st.D}-${st.L}</b><span>Won-drawn-lost · ${st.P} played</span></div>
      <div class="kpi"><b>${st.P?(st.For/st.P).toFixed(1):'–'} <small style="font-size:16px;color:var(--muted)">v ${st.P?(st.Ag/st.P).toFixed(1):'–'}</small></b><span>Avg points scored v conceded</span></div>
      <div class="kpi am"><b>${pct(scores(T),shots(T))}</b><span>Shot conversion (${scores(T)}/${shots(T)})</span></div>
      <div class="kpi"><b>${T.tow-T.tol>0?'+':''}${T.tow-T.tol}</b><span>Turnover difference (${T.tow} won, ${T.tol} lost)</span></div>
    </div>
    ${form.length?`<div class="row"><h3>Form</h3><div class="form">${form.map(g=>`<span class="${g.k}" title="${esc(fmtS(g.u)+' – '+fmtS(g.th)+' v '+g.m.opp)}">${g.k}</span>`).join('')}</div></div>`:''}
  </section>
  <section class="panel"><h3>Scores for and against</h3>${formChart(st.games)}</section>
  <section class="panel"><div class="ph"><h3>Shot map</h3><span class="legend">${located.length} of ${fl.length} shots have a location</span></div>

    <div class="grid2"><div><div class="pitchbox">${pitchSVG({code:t.code,arc:two,dots:shotDots(fl,t)})}</div>${pkey(two)}</div>

      <div class="tw"><table><thead><tr><th>Source</th><th>Shots</th><th>Scored</th><th>%</th></tr></thead><tbody>
      ${srcs.map(r=>`<tr><td>${esc(r.l)}</td><td>${r.a}</td><td>${r.s}</td><td>${pct(r.s,r.a)}</td></tr>`).join('')||'<tr><td colspan="4">No shots yet</td></tr>'}
      ${two?`<tr><td><b>2-point attempts</b></td><td>${T.twoAtt}</td><td>${T.two}</td><td>${pct(T.two,T.twoAtt)}</td></tr>`:''}
      </tbody></table></div>
      <p class="legend">${two?'2-point attempts are shots from outside the 40m arc, plus any 2-pointers logged without a location. ':''}Wides ${T.wide} · Short ${T.short} · Saved ${T.saved}${T.penmiss?' · Pens missed '+T.penmiss:''}</p>
    </section>
    <section class="panel"><h3>${s45}s</h3>
      <div class="kpis"><div class="kpi am"><b>${f45.filter(x=>isScore(x.e.type)).length}/${f45.length}</b><span>${s45}s scored (${pct(f45.filter(x=>isScore(x.e.type)).length,f45.length)})</span></div><div class="kpi"><b>${T.w45}</b><span>${s45}s won</span></div></div>
      <div class="bars">${s45sides.map(b=>barRow(b.l+' side',b.a,Math.max(1,...s45sides.map(x=>x.a)),b.a?`${b.s}/${b.a}`:'–','a')).join('')}</div>
      ${Object.keys(takers).length?`<p class="legend">Takers: ${Object.entries(takers).map(([pid,v])=>esc(pid?(pName(t,pid)||'?'):'Not recorded')+' '+v.s+'/'+v.a).join(' · ')}</p>`:'<p class="legend">No '+s45+'s taken yet.</p>'}
    </section>
  </div>
  <section class="panel"><h3>Possession &amp; restarts</h3>
    ${splitBar('Turnovers','Won',T.tow,'Lost',T.tol)}
    ${splitBar('Our '+ko+'s','Won',T.kow,'Lost',T.kol)}
    ${splitBar('Their '+ko+'s','We won',T.okw,'They kept',T.okl)}
    ${splitBar('Frees','Won',T.fwon,'Given',T.fcon)}
    <p class="legend">${T.pass} passes logged (${(T.pass/P).toFixed(1)} a match). Our ${ko} retention ${pct(T.kow,T.kow+T.kol)}; won ${pct(T.okw,T.okw+T.okl)} of theirs.</p>
  </section>
  <section class="panel"><h3>Top scorers</h3><div class="bars">${rows.filter(r=>r.ptsTotal).slice(0,8).map(r=>barRow(esc('#'+r.p.num+' '+r.p.name),r.ptsTotal,topMax,`${sc(r)} <span class="pc">(${r.ptsTotal})</span>`)).join('')||'<p class="empty">No scores yet.</p>'}</div></section>
  <section class="panel"><h3>Player stats</h3>
    ${rows.length?`<div class="tw"><table><thead><tr><th>Player</th><th>Gms</th><th>Score</th><th>Shots</th>${cols.map(c=>`<th>${c[0]}</th>`).join('')}<th>On/Off</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>#${r.p.num} ${esc(r.p.name)}</td><td>${r.games.size}</td><td><b>${sc(r)}</b> (${r.ptsTotal})</td><td>${scores(r)}/${shots(r)}<span class="pc">${pct(scores(r),shots(r))}</span></td>${cols.map(c=>`<td>${cell(r,c[1])}</td>`).join('')}<td>${r.subOn||r.subOff?r.subOn+'/'+r.subOff:''}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="legend">Gms = matches with a logged action. Fr and Pen = scores from frees and penalties. ${s45}s = scored/taken. Sh = dropped short, Svd = saved or blocked, FW/FG = frees won/given.</p>`
    :'<p class="empty">No player stats yet for this squad. Start a match to begin logging.</p>'}</section>
  <section class="panel"><h3>Results</h3>${played.length?played.map(f=>fxCard(f,true)).join(''):'<p class="empty">No results yet.</p>'}</section>`;
}

function vClub(){
  const today=ymd(new Date());
  const data=S.teams.map(t=>{const st=teamStats(t.id);return{t,st,top:st.rows.filter(r=>r.ptsTotal).sort((a,b)=>b.ptsTotal-a.ptsTotal)[0],
    next:S.fixtures.filter(f=>f.teamId===t.id&&f.status==='upcoming'&&f.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0],
    live:S.fixtures.find(f=>f.teamId===t.id&&f.status==='live')}});
  const tot=data.reduce((a,d)=>({W:a.W+d.st.W,D:a.D+d.st.D,L:a.L+d.st.L,P:a.P+d.st.P}),{W:0,D:0,L:0,P:0});
  return `<section class="panel"><h2>Club overview</h2>
    <div class="kpis"><div class="kpi hi"><b>${tot.W}-${tot.D}-${tot.L}</b><span>All squads · ${tot.P} played</span></div>
      <div class="kpi"><b>${S.teams.length}</b><span>Squads</span></div>
      <div class="kpi am"><b>${S.fixtures.filter(f=>f.status==='upcoming'&&f.date>=today).length}</b><span>Upcoming fixtures</span></div>
      <div class="kpi"><b>${data.filter(d=>d.live).length}</b><span>Live now</span></div></div>
    ${data.length?`<div class="tw"><table class="sq-table"><thead><tr><th>Squad</th><th>P</th><th>W-D-L</th><th>Avg for</th><th>Avg ag</th><th>Shots %</th><th>TO +/-</th><th>Form</th></tr></thead><tbody>
      ${data.map(({t,st})=>`<tr><td>${esc(t.name)}</td><td>${st.P}</td><td>${st.W}-${st.D}-${st.L}</td><td>${st.P?(st.For/st.P).toFixed(1):'–'}</td><td>${st.P?(st.Ag/st.P).toFixed(1):'–'}</td><td>${pct(scores(st.tot),shots(st.tot))}</td><td>${st.tot.tow-st.tot.tol>0?'+':''}${st.tot.tow-st.tot.tol}</td><td>${st.games.slice(-5).map(g=>g.k).join(' ')||'–'}</td></tr>`).join('')}
    </tbody></table></div>`:''}
  </section>
  <div class="grid2">${data.map(({t,st,top,next,live})=>`<article class="panel">
      <div class="ph"><h2>${esc(t.name)}</h2><div class="row">${live?'<span class="chip live">Live now</span>':''}${S.mode==='server'?(t.hasCoachPin?'<span class="chip w">Coach PIN set</span>':'<span class="chip l">No coach PIN</span>'):''}</div></div>
      <p class="legend">${esc(assocOf(t).l)} · ${esc(t.grade)} · ${t.half} min halves${footy(t.code)&&t.arc?' · 2-point arc':''}</p>
      ${st.games.length?`<div class="form">${st.games.slice(-5).map(g=>`<span class="${g.k}">${g.k}</span>`).join('')}</div>`:''}
      <div class="bars">${barRow('Shot conversion',pctN(scores(st.tot),shots(st.tot)),100,pct(scores(st.tot),shots(st.tot)),'a')}${barRow('Own '+KO(t.code)+'s',pctN(st.tot.kow,st.tot.kow+st.tot.kol),100,pct(st.tot.kow,st.tot.kow+st.tot.kol))}</div>
      <p class="legend">${top?'Top scorer: '+esc('#'+top.p.num+' '+top.p.name)+' '+top.goal+'-'+pad(top.point+2*top.two)+'. ':''}${next?'Next: v '+esc(next.opp)+', '+new Date(next.date+'T12:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'})+(next.time?' '+esc(next.time):''):'No upcoming fixture.'}</p>
      <div class="row"><button class="btn sm pri" data-act="statsTeam" data-v="${t.id}">Full stats</button></div></article>`).join('')||'<section class="panel"><p class="empty">No squads yet. Add one under Squads.</p></section>'}</div>`;
}

function vSquads(){
  if(!ui.squadTeam||!team(ui.squadTeam))ui.squadTeam=S.teams[0]&&S.teams[0].id;
  const t=team(ui.squadTeam);const srv=S.mode==='server';
  const roleTxt=S.mode==='demo'?'Demo mode: example data on this phone only. Nothing is shared.':isMgr()?'Signed in as club manager: all squads.':'Signed in as coach: '+S.teams.map(x=>x.name).join(', ')+'.';
  const a=t&&assocOf(t);const gnote=t&&(a.grades.find(g=>g[0]===t.grade)||[])[2];
  return `<section class="panel"><h3>About this demo</h3>
    <p class="legend">Results, dates, opponents and venues are real 2026 Owenmore Gaels fixtures. Players and the minute-by-minute stats behind each score are invented examples. Everything you change is saved on this device only.</p>
    <div class="row"><a class="btn" href="live.html">Parents' page</a><a class="btn" href="me.html">Player page</a><button class="btn warn${A('reset')}" data-act="resetDemo">${ui.armed==='reset'?'Tap again to reset':'Reset demo'}</button></div></section>
  <section class="panel"><h3>Parents' link</h3><p class="legend">Live score, clock, subs and fixture changes. On the live site you'd share it in the club WhatsApp group.</p>
    <div class="row"><input id="l-link" readonly value="${esc(new URL('live.html',location.href).href)}" style="flex:1 1 200px" aria-label="Parents link"><button class="btn" data-act="copyLink">Copy</button></div></section>
  ${isMgr()?`<section class="panel"><h3>Club</h3>
    <div class="logo-row"><div class="badge">${badgeHTML()}</div>
      <label class="btn">${logoSrc()?'Change badge':'Upload club badge'}<input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" data-chg="logo" hidden></label>
      ${logoSrc()?`<button class="btn sm warn${A('dlogo')}" data-act="delLogo">${ui.armed==='dlogo'?'Tap to remove':'Remove'}</button>`:''}</div>
    <p class="legend">The badge appears on the coach app, the parents' page and player pages. A square PNG with a transparent or white background works best.</p>
    <label class="f">Club name<input id="club" value="${esc(S.club)}" data-chg="club"></label></section>`:''}
  <section class="panel"><div class="seg">${S.teams.map(x=>`<button data-act="squadTeam" data-v="${x.id}" aria-pressed="${t&&x.id===t.id}">${esc(x.name)}</button>`).join('')}${isMgr()?'<button data-act="addTeam">+ Add squad</button>':''}</div></section>
  ${t?`<section class="panel">
    <div class="row"><label class="f">Squad name<input id="t-name" value="${esc(t.name)}" data-chg="team" data-id="${t.id}" data-k="name"></label>
      <label class="f">Association<select id="t-assoc" data-chg="team" data-id="${t.id}" data-k="assoc">${Object.entries(ASSOC).map(([k,v])=>`<option value="${k}" ${t.assoc===k?'selected':''}>${esc(v.l)}</option>`).join('')}</select></label></div>
    <div class="row"><label class="f">Age grade<select id="t-grade" data-chg="team" data-id="${t.id}" data-k="grade">${a.grades.map(g=>`<option ${t.grade===g[0]?'selected':''}>${esc(g[0])}</option>`).join('')}</select></label>
      <label class="f">Half length (min)<input id="t-half" type="number" min="1" max="45" value="${t.half}" data-chg="team" data-id="${t.id}" data-k="half"></label></div>
    ${footy(t.code)?`<label class="row" style="gap:10px"><input id="t-arc" type="checkbox" ${t.arc?'checked':''} data-chg="team" data-id="${t.id}" data-k="arc"> <span>2-point arc in use (scores from outside 40m count 2; ${t.code==='ladies'?'LGFA':'GAA'} 45s scored count 2)</span></label>`:''}
    <p class="legend">${esc(a.l)} ${esc(t.grade)}: default ${gradeHalf(t)} min halves${gnote?' ('+esc(gnote)+')':''}. ${t.assoc==='lgfa'?'LGFA rules set 30-minute halves from U14 up; younger grades follow county and Go Games rules.':'Go Games grades (U7–U11) use short halves and small-sided games.'} Check your county board's rules and change the half length if needed.</p>
    <label class="f">Names on the parents' page<select id="t-names" data-chg="team" data-id="${t.id}" data-k="names"><option value="num" ${(t.names||'num')==='num'?'selected':''}>Numbers only</option><option value="first" ${t.names==='first'?'selected':''}>Number + first name</option><option value="full" ${t.names==='full'?'selected':''}>Number + full name</option></select></label>
    <p class="legend">The parents' page is public, so check the club's safeguarding policy before showing under-age players' names.</p>
    ${isMgr()&&S.mode==='server'?`<div class="grp"><h3>Coach PIN for ${esc(t.name)}</h3>
      <div class="row"><input id="cpin-${t.id}" type="password" inputmode="numeric" placeholder="${t.hasCoachPin?'Set a new PIN (6–10 digits)':'6–10 digits'}" style="flex:1 1 160px" aria-label="Coach PIN"><button class="btn" data-act="setPin" data-id="${t.id}">${t.hasCoachPin?'Change PIN':'Set PIN'}</button></div>
      <p class="legend">${t.hasCoachPin?'A coach PIN is set. Changing it signs other coaches out of this squad.':'Coaches can’t sign in to this squad until you set a PIN.'}</p></div>`:''}
  </section>
  <section class="panel"><div class="ph"><h3>Players (${t.players.length})</h3><div class="row"><button class="btn sm" data-act="copyAllCodes" data-id="${t.id}">Copy all player links</button><button class="btn sm pri" data-act="addPl" data-id="${t.id}">+ Add player</button></div></div>
    <p class="legend">Each player has a private code. Their link opens a page with only their own stats.</p>
    ${t.players.map(p=>`<div class="prow2"><input type="number" min="1" max="99" value="${p.num}" aria-label="Number" data-chg="pl" data-id="${t.id}" data-pid="${p.id}" data-k="num" id="pn-${p.id}"><input class="pname" value="${esc(p.name)}" placeholder="Player name" aria-label="Name" data-chg="pl" data-id="${t.id}" data-pid="${p.id}" data-k="name" id="pm-${p.id}">
      <div class="pcode"><code>${esc(p.code||'')}</code><button class="btn sm" data-act="copyMe" data-id="${t.id}" data-pid="${p.id}">Copy link</button><button class="btn sm${A('nc'+p.id)}" data-act="newCode" data-id="${t.id}" data-pid="${p.id}">${ui.armed==='nc'+p.id?'Replace code?':'New code'}</button><button class="btn sm${A('dp'+p.id)}" data-act="delPl" data-id="${t.id}" data-pid="${p.id}" aria-label="Remove player">${ui.armed==='dp'+p.id?'Remove?':'✕'}</button></div></div>`).join('')||'<p class="empty">No players yet.</p>'}
    ${isMgr()?`<div class="row"><button class="btn warn sm${A('dt'+t.id)}" data-act="delTeam" data-id="${t.id}">${ui.armed==='dt'+t.id?'Tap again: deletes squad, fixtures and stats':'Delete this squad'}</button></div>`:''}
  </section>`:`<section class="panel"><p class="empty">${isMgr()?'No squads yet. Tap + Add squad.':'No squads linked to your PIN.'}</p></section>`}
  <section class="panel"><h3>Backup</h3>
    <p class="legend">${srv?'Everything syncs to the club site. A backup copy is still handy at the end of the season.':'Demo data lives on this phone only.'}</p>
    <textarea id="bk" rows="3" placeholder="Paste a backup here to restore">${esc(ui.backup)}</textarea>
    <div class="row"><button class="btn" data-act="backup">Copy backup</button><button class="btn${A('restore')}" data-act="restore">${ui.armed==='restore'?'Tap again to replace data':'Restore backup'}</button></div></section>`;
}

function render(){
  const signedIn=true;
  const nav=document.getElementById('nav');nav.hidden=!signedIn;
  if(signedIn){
    const tabs=[['match','Match'],['fixtures','Fixtures'],['stats','Stats']].concat(isMgr()?[['club','Club']]:[]).concat([['squads','Squads']]);
    if(!tabs.some(x=>x[0]===S.tab))S.tab='match';
    nav.innerHTML=tabs.map(([v,l])=>`<button data-act="tab" data-v="${v}" aria-current="${S.tab===v?'page':'false'}">${l}</button>`).join('');
  }
  document.getElementById('clubname').textContent=S.club;
  document.getElementById('badge').innerHTML=badgeHTML();
  const m=signedIn&&active();
  document.getElementById('sub').innerHTML=m?'Live: v '+esc(m.opp):'Demo · <a href="live.html">Parents</a> · <a href="me.html">Players</a>';
  const app=document.getElementById('app');
  app.innerHTML=!signedIn?vLogin():S.tab==='fixtures'?vFixtures():S.tab==='stats'?vStats():S.tab==='club'?vClub():S.tab==='squads'?vSquads():vMatch();
  tick();setSync(sync.state,sync.msg);
}

/* ========== boot ========== */
(function boot(){
  S=loadDemo();S.mode='demo';S.role='manager';
  S.teams.forEach(normTeam);
  if(S.active&&!active())S.active=null;
  render();
  if(active()&&active().clock.running)keepAwake(true);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const m=active();if(m&&m.clock.running){wake=null;keepAwake(true)}}});

})();
</script>
</body></html>
