<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132a86"><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Gaels Beo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Owenmore Gaels shared theme: royal blue band + amber accents. Layout: blue header band with badge, one working column of panels. */
:root{
  --bg:#f1f3fa; --surface:#ffffff; --surface2:#ecf0f9; --line:#d3d9ea; --fg:#0f1a3a; --muted:#566079;
  --royal:#1f3fbf; --royal-2:#132a86; --royal-text:#1f3fbf; --royal-soft:#e3e9fb;
  --amber:#f5a800; --amber-ink:#1d1300; --amber-text:#9a6300; --amber-soft:#fff3d6;
  --them:#0d7d72; --good:#16884f; --bad:#cf3a2e; --card-y:#f2c200; --card-r:#cf3a2e; --card-b:#15171d;
  --pitch:#e6ecfb; --pitch-line:#a8b6df; --goal:#17a34a; --pointc:#ffffff; --point-edge:#0f1a3a; --two:#ff7a00; --miss:#b0122c; --on-band:#ffffff; --on-band-muted:rgba(255,255,255,.72);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070c1d; --surface:#0f1730; --surface2:#16203f; --line:#26335d; --fg:#e8ecf8; --muted:#98a3c4;
  --royal:#2f52d6; --royal-2:#14246a; --royal-text:#7e9bff; --royal-soft:#18245a;
  --amber:#ffb81f; --amber-ink:#1d1300; --amber-text:#ffc449; --amber-soft:#2e2510;
  --them:#33c4b2; --good:#3fd08a; --bad:#ff6a5e; --card-y:#ffd23f; --card-r:#ff6a5e; --card-b:#d4dae9;
  --pitch:#0c1636; --pitch-line:#33478a; --goal:#2fc766; --pointc:#ffffff; --point-edge:#0f1a3a; --two:#ff8a1f; --miss:#ff4d78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070c1d; --surface:#0f1730; --surface2:#16203f; --line:#26335d; --fg:#e8ecf8; --muted:#98a3c4;
  --royal:#2f52d6; --royal-2:#14246a; --royal-text:#7e9bff; --royal-soft:#18245a;
  --amber:#ffb81f; --amber-ink:#1d1300; --amber-text:#ffc449; --amber-soft:#2e2510;
  --them:#33c4b2; --good:#3fd08a; --bad:#ff6a5e; --card-y:#ffd23f; --card-r:#ff6a5e; --card-b:#d4dae9;
  --pitch:#0c1636; --pitch-line:#33478a; --goal:#2fc766; --pointc:#ffffff; --point-edge:#0f1a3a; --two:#ff8a1f; --miss:#ff4d78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--royal-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}

/* Header band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(120deg,var(--royal) 0%,var(--royal-2) 85%);color:var(--on-band);border-bottom:4px solid var(--amber)}
.top-in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:8px}
.badge{width:46px;height:46px;border-radius:10px;flex:none;background:var(--amber);color:var(--royal-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.badge img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand .bt{min-width:0;flex:1}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--on-band);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:flex;align-items:center;gap:6px;color:var(--on-band-muted);font-size:13px;margin-top:2px}
.brand a{color:var(--on-band)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:1;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-4px;padding:8px 6px 9px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.07em;text-transform:uppercase;color:var(--on-band-muted);white-space:nowrap}
nav button[aria-current="page"]{color:var(--on-band);border-bottom-color:var(--amber)}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--on-band-muted)}
.ldot[data-s=ok]{background:#46e08f}.ldot[data-s=err]{background:#ff6a5e}.ldot[data-s=wait]{background:var(--amber)}.ldot[data-s=off]{display:none}

/* Page column and panels */
main{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 80px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:0}
.empty{text-align:center;padding:16px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface2);white-space:nowrap}
.chip.w{color:var(--good);border-color:var(--good)} .chip.l{color:var(--bad);border-color:var(--bad)} .chip.d{color:var(--amber-text);border-color:var(--amber)}
.chip.live{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:600;color:var(--fg);text-decoration:none;display:inline-block}
.btn.pri{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.amb{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.armed{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;color:var(--fg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:1 1 140px;min-width:0}
label.f input,label.f select{font-size:15px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.hi{background:var(--royal);color:#fff}.kpi.hi span{color:rgba(255,255,255,.75)}
.kpi.am{background:var(--amber-soft)}.kpi.am b{color:var(--amber-text)}

/* Bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar .trk i{display:block;height:100%;background:var(--royal)}
.bar .trk i.a{background:var(--amber)} .bar .trk i.t{background:var(--them)} .bar .trk i.m{background:var(--line)}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.5em;text-align:right}
.split{display:flex;flex-direction:column;gap:4px}
.split .hd{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.split .hd b{color:var(--fg);font-variant-numeric:tabular-nums}
.split .trk{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface2)}
.split .trk i{display:block;height:100%}
.split .trk i:first-child{background:var(--royal)} .split .trk i:last-child{background:var(--amber)}

/* Pitch */
.pitch{width:100%;max-width:100%;display:block;touch-action:manipulation}
.pitch .grass{fill:var(--pitch)}
.pitch .ln{stroke:var(--pitch-line);stroke-width:1.5;fill:none}
.pitch .arc{stroke:var(--amber);stroke-width:2;fill:none;stroke-dasharray:6 4}
.pitch .l45{stroke:var(--royal-text);stroke-width:3}
.pitch .post{stroke:var(--royal-text);stroke-width:4}
.pitch .lbl{fill:var(--muted);font-size:10px;font-family:var(--body)}
.pitch .dot-s{fill:var(--amber);stroke:var(--royal-2);stroke-width:1.5}
.pitch .dot-g{fill:var(--royal);stroke:var(--amber);stroke-width:2.5}
.pitch .dot-2{fill:var(--amber);stroke:var(--fg);stroke-width:2.5}
.pitch .dot-m{fill:var(--surface);stroke:var(--bad);stroke-width:2}
.pitch .mark{fill:var(--amber);stroke:var(--fg);stroke-width:2}
.pkey{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.pkey i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.pkey .s{background:var(--amber);border:1.5px solid var(--royal-2)} .pkey .g{background:var(--royal);border:2px solid var(--amber)} .pkey .two{background:var(--amber);border:2px solid var(--fg)} .pkey .m{background:var(--surface);border:2px solid var(--bad)}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th:first-child{background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .pc{color:var(--muted);font-size:12px;margin-left:4px}

/* Form strip */
.form{display:flex;gap:6px;flex-wrap:wrap}
.form span{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:#fff}
.form .W{background:var(--good)} .form .L{background:var(--bad)} .form .D{background:var(--amber);color:var(--amber-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.grid2>*{min-width:0}

/* Score colour code: green goal, white point, orange 2-pointer, red miss */
.pitch .dot-g{fill:var(--goal);stroke:#fff;stroke-width:2}
.pitch .dot-s{fill:var(--pointc);stroke:var(--point-edge);stroke-width:1.8}
.pitch .dot-2{fill:var(--two);stroke:#fff;stroke-width:1.8}
.pitch .dot-m{fill:var(--miss);stroke:#fff;stroke-width:1.5}
.pkey .g{background:var(--goal);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pkey .s{background:var(--pointc);border:1.5px solid var(--point-edge)}
.pkey .two{background:var(--two);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pkey .m{background:var(--miss);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tag.goal{background:var(--goal)!important;color:#fff!important}
.tag.point{background:var(--pointc)!important;color:#0f1a3a!important;box-shadow:inset 0 0 0 1.5px var(--point-edge)}
.tag.two{background:var(--two)!important;color:#1d1000!important}
.tag.wide,.tag.short,.tag.saved{background:var(--miss)!important;color:#fff!important}
.ev.t-goal{border-left-color:var(--goal)!important}.ev.t-point{border-left-color:var(--point-edge)!important}.ev.t-two{border-left-color:var(--two)!important}.ev.t-wide,.ev.t-short,.ev.t-saved{border-left-color:var(--miss)!important}

.pitch .dot-x path{stroke:var(--miss);stroke-width:3;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 1px #fff)}
.pkey .m{background:none!important;border:0!important;box-shadow:none!important;position:relative}
.pkey .m::before,.pkey .m::after,.dotk.m::before,.dotk.m::after{content:"";position:absolute;left:50%;top:50%;width:13px;height:3px;background:var(--miss);border-radius:2px}
.pkey .m::before,.dotk.m::before{transform:translate(-50%,-50%) rotate(45deg)} .pkey .m::after,.dotk.m::after{transform:translate(-50%,-50%) rotate(-45deg)}
/* Coach app components */
.board{background:linear-gradient(140deg,var(--royal) 0%,var(--royal-2) 100%);color:var(--on-band);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;border-bottom:4px solid var(--amber)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.sb .tn{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;line-height:1.1;text-wrap:balance}
.sb .tn small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--on-band-muted);letter-spacing:0}
.sb .sc{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,60px);white-space:nowrap;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.sb .them .sc{color:#fff}
.sb .tot{color:var(--on-band-muted);font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(38px,11vw,54px);line-height:1;color:#fff;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.22);border-radius:10px;padding:4px 10px}
.clock.paused{opacity:.6}
.per{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-band-muted);margin-top:4px}
.over{font-family:var(--display);font-weight:600;font-size:16px;color:var(--amber);min-height:20px;font-variant-numeric:tabular-nums}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl .btn{padding:13px;font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.board .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.board .btn.run-off{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.board .btn.run-on{background:transparent;border:2px solid #fff;color:#fff}
.board .btn.armed{background:var(--bad)!important}
.board input{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.board .muted,.board label{color:var(--on-band-muted)}
.board .chip{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.alertbar{background:var(--amber);color:var(--amber-ink);border-radius:10px;padding:10px 12px;font-weight:600}
.flash{animation:flash .6s 4}
@keyframes flash{50%{background:#fff}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

.pad{display:flex;flex-direction:column;gap:10px}
.pad.us .ph h2{color:var(--royal-text)} .pad.them .ph h2{color:var(--them)}
.grp{display:flex;flex-direction:column;gap:6px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.key{min-height:56px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--royal-text);font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:4px}
.key small{font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.key:active{transform:scale(.97)}
.key.score{min-height:72px;font-size:22px;background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.key.score small{color:rgba(29,19,0,.7)}
.key.set{border-color:var(--royal);border-width:2px}
.pad.them .key{color:var(--them)}
.pad.them .key.score{background:transparent;border:2px solid var(--them);color:var(--them)}
.pad.them .key.score small{color:var(--muted)}
.key.y{border-color:var(--card-y);color:var(--fg)} .key.y::before,.key.r::before,.key.bk::before{content:"";width:12px;height:16px;border-radius:2px;margin-bottom:3px}
.key.y::before{background:var(--card-y)} .key.r{border-color:var(--card-r);color:var(--fg)} .key.r::before{background:var(--card-r)} .key.bk{border-color:var(--card-b);color:var(--fg)} .key.bk::before{background:var(--card-b)}
.key.sub{border-color:var(--royal);color:var(--royal-text)}

.log{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:76px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface2);border-left:4px solid var(--royal)}
.ev.them{border-left-color:var(--them)}
.ev.sc{border-left-color:var(--amber)}
.ev .t{font-family:var(--display);font-weight:600;color:var(--amber-text);font-variant-numeric:tabular-nums}
.ev .what{min-width:0}
.ev .what span{color:var(--muted);font-size:13px}

.sheet-bg{position:fixed;inset:0;background:rgba(5,10,30,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:780px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;border-top:4px solid var(--amber);padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.where{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;min-height:24px}
.where b{font-family:var(--display);font-size:18px;letter-spacing:.03em}
.pitchbox{max-width:420px;width:100%;margin:0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.pbtn{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;min-height:60px;color:var(--fg)}
.pbtn b{font-family:var(--display);font-size:24px;line-height:1;color:var(--royal-text)}
.pbtn span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pbtn.off{opacity:.4}
.seg.out button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:600;text-align:center;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.cal button{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;padding:0;color:var(--fg)}
.cal button.blank{visibility:hidden}
.cal button.today{border-color:var(--amber);border-width:2px}
.cal button.sel{background:var(--royal);color:#fff;border-color:var(--royal)}

const crestUrl = (c) => BASE + c.id + "/" + encodeURIComponent(c.f);

// Normalise a club name for matching: "St. Mary's" -> "st marys", "Calry/St. Joseph's" -> "calry/st josephs"
const norm = (s) => String(s || "").toLowerCase().replace(/[’'`.]/g, "").replace(/\b(gaa|gfc|lgfa|club|cumann)\b/g, "")
  .replace(/[^a-z0-9/ ]+/g, " ").replace(/\s*\/\s*/g, "/").replace(/\s+/g, " ").trim();

// Find the crest for a team name as written on fixtures (amalgamations use the first club).
function crestFor(name) {
  const n = norm(name); if (!n) return null;
  const names = (c) => [c.n, ...(c.a || [])].map(norm);
  for (const c of CRESTS) if (names(c).includes(n)) return c;
  const first = n.split("/")[0].trim();
  for (const c of CRESTS) if (names(c).includes(first)) return c;
  let best = null;
  for (const c of CRESTS) for (const cn of names(c).map((x) => x.split("/")[0].trim()))
    if (cn.length > 3 && (first.startsWith(cn) || cn.startsWith(first)) && (!best || cn.length > best.l)) best = { c, l: cn.length };
  return best ? best.c : null;
}
/* ===== Owenmore Gaels demo: shared model + example season =====

const DEMO_KEY='owenmore-gaels-demo-v2', DEMO_VER=6;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const mmss=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/60))+':'+pad(s%60)};
const HOME_GROUND='Connolly Park, Collooney';

const OG={};
OG.LABEL={goal:'Goal',point:'Point',two:'2-pointer',wide:'Wide',short:'Dropped short',saved:'Saved / blocked',w45:'45 won',
  fwon:'Free won',fcon:'Free conceded',kow:'Kick-out won',kol:'Kick-out lost',okw:'Their kick-out won',okl:'Their kick-out lost',
  tow:'Turnover won',tol:'Turnover lost',save:'Save',yellow:'Yellow card',black:'Black card',red:'Red card',sub:'Substitution',bloodret:'Blood sub return',note:'Note'};
OG.PTS={goal:3,point:1,two:2};
OG.SHOTS=['goal','point','two','wide','short','saved'];
OG.SRC={play:'Play',free:'Free','45':'45',pen:'Penalty',mark:'Mark'};
OG.isScore=t=>t==='goal'||t==='point'||t==='two';
OG.footy=code=>code!=='hurling';
OG.label=(t,code)=>{const l=OG.LABEL[t]||t;return code==='hurling'?l.replace('45 won','65 won').replace('kick-out','puck-out'):l};
OG.srcLabel=(s,code)=>s==='45'&&code==='hurling'?'65':OG.SRC[s]||'';
OG.set45=code=>OG.footy(code)?'45':'65';
OG.KO=code=>OG.footy(code)?'kick-out':'puck-out';
OG.score=(m,side)=>{let g=0,p=0;for(const e of m.events){if(e.side!==side)continue;if(e.type==='goal')g++;else if(e.type==='point')p++;else if(e.type==='two')p+=2}return{g,p,t:g*3+p}};
OG.fmt=s=>s.g+'-'+pad(s.p);
OG.scoreUpTo=(m,side,maxAbs)=>{let g=0,p=0;for(const e of m.events){if(e.side!==side||OG.abs(m,e.per,e.sec)>maxAbs)continue;if(e.type==='goal')g++;else if(e.type==='point')p++;else if(e.type==='two')p+=2}return{g,p,t:g*3+p}};
OG.TIERS={adult:'Adult',minor:'Minor',gogames:'Go Games'};

/* ----- periods and match time -----
   period: 0 pre-match, 1, 'HT', 2, 'FT', 3 (ET 1st), 'ETH', 4 (ET 2nd), 'AET' */
OG.perLen=(m,p)=>(p<=2?m.half:(m.etHalf||10))*60;
OG.dur=(m,p)=>{const d=m.clock&&m.clock.durs&&m.clock.durs[p];return typeof d==='number'?d:OG.perLen(m,p)};
OG.before={0:0,1:0,HT:1,2:1,FT:2,3:2,ETH:3,4:3,AET:4};
OG.abs=(m,per,sec)=>{let t=0;const n=OG.before[per]??0;for(let p=1;p<=n;p++)t+=OG.dur(m,p);return t+(typeof per==='number'&&per>0?sec:0)};
OG.elapsed=(m,now)=>{const c=m.clock;return c.acc+(c.running?((now||Date.now())-c.since)/1000:0)};
OG.nowAbs=(m,now)=>{const c=m.clock;return typeof c.period==='number'&&c.period>0?OG.abs(m,c.period,OG.elapsed(m,now)):OG.abs(m,c.period,0)};
OG.minOf=(sec,half)=>{const mn=Math.floor(sec/60)+1;return half&&mn>half?half+'+'+(mn-half)+"'":mn+"'"};
OG.perShort=p=>p===1?'1st half':p===2?'2nd half':p===3?'ET 1st':p===4?'ET 2nd':p==='HT'?'Half time':p==='FT'?'Full time':p==='ETH'?'ET half time':p==='AET'?'After ET':'Pre-match';
OG.halfOf=(m,per)=>per<=2?m.half:(m.etHalf||10);
// running match minute for reports, e.g. 38' or 60+2'
OG.matchMin=(m,e)=>{const mn=Math.floor(e.sec/60)+1,h=OG.halfOf(m,e.per);const base=e.per===2?m.half:e.per===3?2*m.half:e.per===4?2*m.half+(m.etHalf||10):0;
  return mn>h?(base+h)+'+'+(mn-h)+"'":(base+mn)+"'"};

/* ----- privacy tiers and names ----- */
OG.tierOf=t=>t&&t.tier||'adult';
OG.first=n=>String(n||'').split(' ')[0];
OG.pubName=(t,pid)=>{const p=t&&t.players.find(x=>x.id===pid);if(!p)return '';const tier=OG.tierOf(t);return tier==='adult'?`#${p.num} ${p.name}`:tier==='minor'?`#${p.num} ${OG.first(p.name)}`:''};
OG.fullName=(t,pid)=>{const p=t&&t.players.find(x=>x.id===pid);return p?`#${p.num} ${p.name}`:''};

/* ----- sin-bin ----- */
OG.sinbinRule=t=>{ // which card sends a player to the sin-bin, and for how long
  if(t.sinbinCard==='none')return null;
  const card=t.sinbinCard||(t.assoc==='gaa_f'?'black':t.assoc==='lgfa'?'yellow':'none');if(card==='none')return null;
  if(t.assoc==='lgfa'&&OG.gradeAge(t.grade)<=13)return null; // LGFA Rule 408: no sin-bin up to U13
  const mins=t.sinbinMins||(t.assoc==='lgfa'?(t.half>=30?10:t.half>15?5:3):10);
  return{card,secs:mins*60};
};
OG.gradeAge=g=>/minor/i.test(g)?(/18/.test(g)?18:17):/adult/i.test(g)?99:parseInt(String(g).replace(/\D/g,''))||0;
OG.sinbins=(m,t,now)=>{ // active sin-bins with seconds left (playing time)
  const na=OG.nowAbs(m,now),out=[];
  for(const e of m.events){if(!e.sinbin)continue;const left=e.sinbin-(na-OG.abs(m,e.per,e.sec));if(left>-30)out.push({e,left})}
  return out;
};

/* ----- minutes played (from starting team + subs log) ----- */
OG.minutes=(m,rules,now)=>{
  rules=rules||{bloodCounts:true,sinbinCounts:false};
  const end=m.ended||m.clock.period==='FT'||m.clock.period==='AET'?OG.abs(m,m.clock.period==='AET'?'AET':'FT',0):OG.nowAbs(m,now);
  const ev=[];for(const e of m.events)if(e.side==='us'&&['sub','bloodret','red'].includes(e.type)||e.side==='us'&&e.sinbin)ev.push({t:OG.abs(m,e.per,e.sec),e});
  if(!rules.sinbinCounts)for(const x of ev.slice())if(x.e.sinbin)ev.push({t:x.t+x.e.sinbin,e:{type:'sinret',pid:x.e.pid}});
  ev.sort((a,b)=>a.t-b.t);
  const secs={},since={},blood=new Set(),off=new Set();
  const open=(pid,t)=>{if(pid&&!(pid in since)&&!off.has(pid))since[pid]=t};
  const close=(pid,t)=>{if(pid in since){const d=Math.max(0,Math.min(t,end)-since[pid]);if(!blood.has(pid)||rules.bloodCounts)secs[pid]=(secs[pid]||0)+d;delete since[pid]}};
  (m.lineup||[]).forEach(pid=>open(pid,0));
  for(const {t,e} of ev){if(t>end)break;
    if(e.type==='sub'){close(e.pid,t);if(e.blood)blood.add(e.onId);open(e.onId,t)}
    else if(e.type==='bloodret'){close(e.pid,t);open(e.onId,t)}
    else if(e.type==='red'){close(e.pid,t);off.add(e.pid)}
    else if(e.sinbin&&!rules.sinbinCounts)close(e.pid,t);
    else if(e.type==='sinret')open(e.pid,t);
  }
  for(const pid of Object.keys(since))close(pid,end);
  return secs;
};
OG.onPitch=(m)=>{ // who's on the pitch after the subs/reds logged so far
  const set=new Set(m.lineup||[]);
  const ev=m.events.filter(e=>e.side==='us'&&['sub','bloodret','red'].includes(e.type)).sort((a,b)=>OG.abs(m,a.per,a.sec)-OG.abs(m,b.per,b.sec));
  for(const e of ev){if(e.type==='red')set.delete(e.pid);else{set.delete(e.pid);if(e.onId)set.add(e.onId)}}
  return set;
};

/* ----- tallies ----- */
OG.blank=()=>{const r={scoreG:0,scoreP:0,pts:0,fromFree:0,from45:0,fromPen:0,subOn:0,subOff:0,t45:0,s45:0,twoAtt:0};for(const k in OG.LABEL)r[k]=0;return r};
OG.outsideArc=(e,m)=>OG.footy(m.code)&&m.arc&&typeof e.lx==='number'&&Math.hypot(e.lx-40,e.ly)>=40;
OG.tally=(r,e,m)=>{if(e.type in r)r[e.type]++;
  if(OG.SHOTS.includes(e.type)){if(e.src==='45'){r.t45++;if(OG.PTS[e.type])r.s45++}if(e.type==='two'||OG.outsideArc(e,m))r.twoAtt++}
  if(OG.PTS[e.type]){r.pts+=OG.PTS[e.type];if(e.type==='goal')r.scoreG++;else r.scoreP+=OG.PTS[e.type];if(e.src==='free')r.fromFree++;if(e.src==='45')r.from45++;if(e.src==='pen')r.fromPen++}};
// A turnover won by one team is a turnover lost by the other; their kick-out lost is one we won.
OG.cross=(r,e)=>{if(e.type==='kow')r.okl++;else if(e.type==='kol')r.okw++;else if(e.type==='tow')r.tol++;else if(e.type==='tol')r.tow++;else if(e.type==='okw')r.kol++;else if(e.type==='okl')r.kow++};
OG.summary=(m,side)=>{const r=OG.blank();for(const e of m.events){if(e.side===side)OG.tally(r,e,m);else OG.cross(r,e)}
  return{scores:r.goal+r.point+r.two,shots:OG.SHOTS.reduce((a,t)=>a+r[t],0),wide:r.wide,tow:r.tow,tol:r.tol,kow:r.kow,kol:r.kol,okw:r.okw,okl:r.okl,fwon:r.fwon,fcon:r.fcon,y:r.yellow,b:r.black,r:r.red,save:r.save}};

/* ----- match report ----- */
OG.report=(S,m,publicVersion)=>{
  const t=S.teams.find(x=>x.id===m.teamId),f=S.fixtures.find(x=>x.id===m.fixtureId)||{};
  const nm=pid=>publicVersion?OG.pubName(t,pid):OG.fullName(t,pid);
  const us=OG.score(m,'us'),th=OG.score(m,'them'),ht1=OG.scoreUpTo(m,'us',OG.abs(m,'HT',0)),ht2=OG.scoreUpTo(m,'them',OG.abs(m,'HT',0));
  const aet=m.events.some(e=>e.per===3||e.per===4)||m.clock.period==='AET';
  const res=us.t>th.t?'beat':us.t<th.t?'lost to':'drew with';
  const d=new Date(m.date+'T12:00').toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long'});
  const where=f.ground||(f.venue==='Home'?HOME_GROUND:'');
  let s=`${S.club} ${t.name} ${res} ${m.opp}, ${OG.fmt(us)} (${us.t}) to ${OG.fmt(th)} (${th.t})${aet?' after extra time':''}`;
  s+=` in the ${f.comp||'match'}${where?' at '+where:''} on ${d}.`;
  if(OG.tierOf(t)==='gogames')return `${S.club} ${t.name} played ${m.opp} in a Go Games fixture on ${d}${where?' at '+where:''}. Go Games are non-competitive, so no scores are recorded.`;
  s+=` The half-time score was ${OG.fmt(ht1)} to ${OG.fmt(ht2)}.`;
  const sc={};for(const e of m.events)if(e.side==='us'&&OG.isScore(e.type)&&e.pid){const r=sc[e.pid]||(sc[e.pid]={g:0,p:0,b:{}});if(e.type==='goal')r.g++;else r.p+=OG.PTS[e.type];
    const k=e.src==='free'?'f':e.src==='45'?OG.set45(m.code):e.src==='pen'?'pen':e.src==='mark'?'m':null;if(k){const b=r.b[k]||(r.b[k]={g:0,p:0});if(e.type==='goal')b.g++;else b.p+=OG.PTS[e.type]}}
  const list=Object.entries(sc).sort((a,b)=>(b[1].g*3+b[1].p)-(a[1].g*3+a[1].p)).map(([pid,r])=>{const br=Object.entries(r.b).map(([k,b])=>`${b.g}-${b.p} ${k}`);return `${nm(pid).replace(/^#\d+ /,'')||'Unknown'} ${r.g}-${pad(r.p)}${br.length?' ('+br.join(', ')+')':''}`});
  if(list.length)s+=`\n\nScorers: ${list.join(', ')}.`;
  const S1=OG.summary(m,'us'),S2=OG.summary(m,'them');
  s+=`\n\nShooting: ${S1.scores} scores from ${S1.shots} shots (${S1.shots?Math.round(S1.scores*100/S1.shots):0}%), ${S1.wide} wides. ${m.opp}: ${S2.wide} wides.`;
  if(!publicVersion){
    s+=` Turnovers ${S1.tow} won, ${S1.tol} lost. Own ${OG.KO(m.code)}s ${S1.kow}/${S1.kow+S1.kol} kept; won ${S1.okw} of theirs.`;
    const subs=m.events.filter(e=>e.side==='us'&&e.type==='sub').map(e=>`${OG.matchMin(m,e)} ${nm(e.onId).replace(/^#\d+ /,'')} for ${nm(e.pid).replace(/^#\d+ /,'')}${e.blood?' (blood)':''}`);
    if(subs.length)s+=`\n\nSubs: ${subs.join('; ')}`;
    const cards=m.events.filter(e=>['yellow','black','red'].includes(e.type)).map(e=>`${OG.label(e.type,m.code).replace(' card','')} ${e.side==='us'?nm(e.pid).replace(/^#\d+ /,''):m.opp} ${OG.matchMin(m,e)}${e.sinbin?' (sin-bin)':''}`);
    if(cards.length)s+=`\nCards: ${cards.join('; ')}`;
    const notes=m.events.filter(e=>e.type==='note').map(e=>`${OG.matchMin(m,e)} ${e.text}`);
    if(notes.length)s+=`\n\nNotes: ${notes.join(' / ')}`;
  }
  return s;
};

function dmGen(t,res,R,by){

  const loc=(a,b)=>{for(;;){const dd=a+R()*(b-a),an=(R()*2-1)*1.15,lx=40+dd*Math.sin(an),ly=dd*Math.cos(an);if(lx>2&&lx<78&&ly>1&&ly<54)return{lx:Math.round(lx*2)/2,ly:Math.round(ly*2)/2}}};

/* ========== pitch (metres; attacking goal at the top) ========== */
const PW=80;

const outsideArc=(e,code,arc)=>footy(code)&&arc&&hasLoc(e)&&distM(e)>=40;

function pitchSVG(o){
  const D=DEPTH(o.code),Sx=4,w=PW*Sx,h=D*Sx,X=m=>m*Sx;

  s+=`<rect class="grass" x="0" y="0" width="${w}" height="${h}"/>`;
  s+=`<rect class="ln" x="${X(30.5)}" y="0" width="${X(19)}" height="${X(13)}"/><rect class="ln" x="${X(33)}" y="0" width="${X(14)}" height="${X(4.5)}"/>`;
  s+=`<path class="ln" d="M${X(27)} ${X(20)} A${X(13)} ${X(13)} 0 0 0 ${X(53)} ${X(20)}"/>`;
  for(const m of[13,20,45,65])if(m<D)s+=`<line class="ln${o.hl45&&m===(footy(o.code)?45:65)?' l45':''}" x1="0" y1="${X(m)}" x2="${w}" y2="${X(m)}"/><text class="lbl" x="${w-4}" y="${X(m)-4}" text-anchor="end">${m}m</text>`;
  if(footy(o.code)&&o.arc)s+=`<path class="arc" d="M0 0 A${X(40)} ${X(40)} 0 0 0 ${w} 0"/><text class="lbl" x="${X(40)}" y="${X(40)+13}" text-anchor="middle">2-point arc</text>`;
  s+=`<line class="post" x1="${X(36.75)}" y1="2" x2="${X(43.25)}" y2="2"/>`;

  if(o.mark)s+=`<circle class="mark" cx="${o.mark.lx*Sx}" cy="${o.mark.ly*Sx}" r="9"/>`;
  return s+'</svg>';
}

    if(['half','etHalf','onField','sinbinMins'].includes(d.k))t[d.k]=Math.max(1,Number(el.value)||t[d.k]);
    else if(['arc','shotLoc','leaderboard'].includes(d.k))t[d.k]=el.checked;
    else t[d.k]=el.value;
    if(d.k==='assoc'){t.arc=undefined;normTeam(t);const h=gradeHalf(t);if(h)t.half=h}
    if(d.k==='grade'){const h=gradeHalf(t);if(h)t.half=h;t.arc=defaultArc(t);t.tier=defaultTier(t);t.onField=t.tier==='gogames'?11:15}
    normTeam(t);persist();render()}
  if(d.chg==='pl'){const t=team(d.id),p=player(t,d.pid);if(!p)return;if(d.k==='num')p.num=Number(el.value)||p.num;else p[d.k]=el.value.trim();t.players.sort((a,b)=>a.num-b.num);persist()}
  if(d.chg==='mhalf'){const m=active();if(!canScore(m))return;m.half=Math.max(1,Number(el.value)||m.half);persist();render()}
  if(d.chg==='club'){S.club=el.value.trim()||'Owenmore Gaels';persist();render()}
  if(d.chg==='setting'){S.settings[d.k]=el.type==='checkbox'?el.checked:el.value.trim();persist();render();toast('Saved')}
  if(d.chg==='mapPl'){ui.mapPl=el.value;render()}
  if(d.chg==='logo'){const f=el.files&&el.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,256/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');persist();render();toast('Badge updated')};img.src=fr.result};fr.readAsDataURL(f)}
});

/* ========== sheets ========== */
function sheet(html,onclick){const sh=document.getElementById('sheet');sh.innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog">${html}</div></div>`;sh.hidden=false;
  sh.onclick=e=>{if(e.target.dataset.close){closeSheet();return}onclick&&onclick(e)}}
function closeSheet(){const sh=document.getElementById('sheet');sh.hidden=true;sh.innerHTML='';sh.onclick=null}
const sheetHead=title=>`<div class="row" style="justify-content:space-between"><h2>${esc(title)}</h2><button class="btn sm" data-close="1">Cancel</button></div>`;
function pgrid(t,ids,mark){const ps=ids.map(id=>player(t,id)).filter(Boolean).sort((a,b)=>a.num-b.num);
  return ps.length?`<div class="pgrid">${ps.map(p=>`<button class="pbtn${mark&&mark.has(p.id)?' on':''}" data-pid="${p.id}"><b>${p.num}</b><span>${esc(p.name||'—')}</span></button>`).join('')}</div>`:'<p class="muted">No players to pick.</p>'}
function describe(m,e){const t=team(m.teamId);return `${lbl(e.type,m.code)} at ${OG.minOf(e.sec,OG.halfOf(m,e.per))} (${OG.perShort(e.per)})${e.pid?' by '+pName(t,e.pid):''}${e.side==='them'?' ('+m.opp+')':''}`}

function openShot(m,type){
  const t=team(m.teamId);const is45=type==='t45';const onIds=[...OG.onPitch(m)];
  let src=is45?'45':'play',out=is45?null:(type==='miss'?'wide':type),side=null,loc=null;
  const finalType=()=>{let ft=out;if(is45&&out==='scored')ft=footy(m.code)&&m.arc?'two':'point';
    if(!is45&&loc&&m.arc&&footy(m.code)&&src!=='pen'){if(ft==='point'&&outsideArc(loc,m.code,m.arc))ft='two';else if(ft==='two'&&!outsideArc(loc,m.code,m.arc))ft='point'}return ft};
  const draw=()=>{
    const title=is45?set45(m.code)+' taken':type==='miss'?'Missed shot':lbl(type,m.code);
    const srcs=is45?[]:Object.keys(SRC).filter(k=>k!=='45'&&!(type!=='goal'&&type!=='miss'&&k==='pen')&&!(type==='goal'&&k==='mark')&&!(!footy(m.code)&&k==='mark')&&!(type==='two'&&k==='pen'));
    const ft=finalType();
    sheet(`${sheetHead(title)}
      ${is45?`<div class="grp"><h3>Result</h3><div class="seg big out">${[['scored','Scored'],['wide','Wide'],['short','Dropped short']].map(([k,l])=>`<button data-out="${k}" aria-pressed="${out===k}">${l}</button>`).join('')}</div></div>
        <div class="grp"><h3>Side</h3><div class="seg">${['Left','Centre','Right'].map(k=>`<button data-side="${k}" aria-pressed="${side===k}">${k}</button>`).join('')}</div></div>`:''}
      ${type==='miss'?`<div class="grp"><h3>Result</h3><div class="seg big out">${[['wide','Wide'],['short','Dropped short'],['saved','Saved / blocked']].map(([k,l])=>`<button data-out="${k}" aria-pressed="${out===k}">${l}</button>`).join('')}</div></div>`:''}
      ${srcs.length?`<div class="grp"><h3>From</h3><div class="seg">${srcs.map(k=>`<button data-src="${k}" aria-pressed="${k===src}">${esc(srcL(k,m.code))}</button>`).join('')}</div></div>`:''}
      ${!is45&&t.shotLoc?`<details class="locbox"${loc?' open':''}><summary>${loc?`Location: ${Math.round(distM(loc))}m, ${sideOf(loc).toLowerCase()}${ft!==out&&isScore(out)?` · logged as ${ft==='two'?'2 points':'1 point'}`:''}`:'Add where it was taken from (optional)'}</summary><div class="pitchbox">${pitchSVG({code:m.code,arc:m.arc,mark:loc,id:'shotpitch'})}</div></details>`:''}
      ${is45&&out==='scored'?`<p class="legend">Counts ${ft==='two'?'2 points (arc rules)':'1 point'}.</p>`:''}
      <div class="grp"><h3>${is45?'Who took it':'Player'}</h3>${pgrid(t,onIds)}</div>
      <button class="btn" data-pid="">No player / not sure</button>`,e=>{
        const o=e.target.closest('[data-out]');if(o){out=o.dataset.out;draw();return}
        const sd=e.target.closest('[data-side]');if(sd){side=sd.dataset.side;draw();return}
        const s=e.target.closest('[data-src]');if(s){src=s.dataset.src;draw();return}
        const b=e.target.closest('[data-pid]');if(!b)return;
        if(is45&&!out){toast('Pick the result first');return}
        const ev={side:'us',type:finalType(),pid:b.dataset.pid||null,src};if(is45){const lx=side==='Left'?14:side==='Right'?66:40;ev.lx=lx;ev.ly=footy(m.code)?45:65}else if(loc){ev.lx=loc.lx;ev.ly=loc.ly}
        closeSheet();addEvent(ev,is45?set45(m.code):null)});
    const svg=document.getElementById('shotpitch');
    if(svg)svg.addEventListener('click',ev=>{const r=svg.getBoundingClientRect();if(!r.width)return;const D=DEPTH(m.code);
      loc={lx:Math.round(Math.max(0,Math.min(PW,(ev.clientX-r.left)/r.width*PW))*2)/2,ly:Math.round(Math.max(0,Math.min(D,(ev.clientY-r.top)/r.height*D))*2)/2};draw()});
  };
  draw();
}
function openCard(m,side){
  const t=team(m.teamId);let card='yellow';const rule=OG.sinbinRule(t);
  const draw=()=>{const sb=rule&&rule.card===card;
    sheet(`${sheetHead(side==='them'?'Card for '+m.opp:'Card')}
      <div class="seg big cards">${['yellow'].concat(hasBlack(m.code)?['black']:[]).concat(['red']).map(k=>`<button class="c-${k}" data-card="${k}" aria-pressed="${card===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
      <p class="legend">${sb?`Sin-bin: ${rule.secs/60} minutes of playing time. A countdown appears on the scoring screen.`:card==='red'?'Sent off for the rest of the match.':'No sin-bin for this card in this grade.'}</p>
      ${side==='them'?'<button class="btn pri" data-pid="">Log card</button>':`<div class="grp"><h3>Player</h3>${pgrid(t,[...OG.onPitch(m)])}</div><button class="btn" data-pid="">No player / not sure</button>`}`,e=>{
      const c=e.target.closest('[data-card]');if(c){card=c.dataset.card;draw();return}
      const b=e.target.closest('[data-pid]');if(!b)return;const ev={side:side||'us',type:card,pid:b.dataset.pid||null};if(sb)ev.sinbin=rule.secs;closeSheet();addEvent(ev)})};
  draw();
}
function openSub(m){
  const t=team(m.teamId);const on=OG.onPitch(m);const sentOff=new Set(m.events.filter(e=>e.type==='red'&&e.side==='us').map(e=>e.pid));
  let off=null,blood=false;
  const draw=()=>{const bench=t.players.filter(p=>!on.has(p.id)&&!sentOff.has(p.id)).map(p=>p.id);
    sheet(`${sheetHead(off?'Player coming on':'Player coming off')}
      <label class="row" style="gap:10px"><input type="checkbox" id="bloodchk" ${blood?'checked':''}> <span>Blood sub (the player can come back on)</span></label>
      ${off?`<p class="legend">Off: ${esc(pName(t,off))}</p>${pgrid(t,bench)}`:pgrid(t,[...on])}`,e=>{
      if(e.target.id==='bloodchk'){blood=e.target.checked;return}
      const b=e.target.closest('[data-pid]');if(!b||!b.dataset.pid)return;
      if(!off){off=b.dataset.pid;draw();return}
      closeSheet();addEvent({side:'us',type:'sub',pid:off,onId:b.dataset.pid,blood})})};
  draw();
}
function openNote(m){
  sheet(`${sheetHead('Add note')}
    <p class="legend">Type, or tap the microphone on your phone's keyboard to dictate. The note is stamped with the match time and shows on the match timeline.</p>
    <textarea id="notetxt" rows="4" placeholder="e.g. Switch #4 onto their #11"></textarea>

  setTimeout(()=>{const n=document.getElementById('notetxt');n&&n.focus()},50);

function openEdit(m,e,justPlayer){
  const t=team(m.teamId);const canEdit=canScore(m)||(m.ended&&canManage(m.teamId));
  if(!canEdit){toast('Only the scorer (or a coach after full time) can change events');return}

    if(ev.target.dataset.del){m.events=m.events.filter(x=>x!==e);audit(m,'Deleted '+describe(m,e));closeSheet();syncResult(m);persist();render();toast('Deleted')}});
}
function openHandover(m){
  const t=team(m.teamId);const opts=S.users.filter(u=>u.id!==m.scorer&&(u.role==='scorer'||u.role==='admin'||(u.role==='coach'&&u.teamId===t.id)));

    const b=e.target.closest('[data-uid]');if(!b)return;const was=userName(m.scorer);m.scorer=b.dataset.uid;const f=fixture(m.fixtureId);if(f)f.scorer=m.scorer;
    audit(m,`Handed scoring from ${was} to ${userName(m.scorer)}`);closeSheet();persist();render();toast('Handed over to '+userName(m.scorer)+'. Switch "Viewing as" to carry on as them.')});
}
function openShare(canvas,text){
  const url=canvas.toDataURL('image/png');
  sheet(`${sheetHead('Share result')}<img src="${url}" alt="${esc(text)}" class="sharecard"><p class="legend">On a phone, long-press the image to save it, or use Share to send it to WhatsApp.</p><div class="row"><button class="btn pri" data-sh="1">Share</button><button class="btn" data-sv="1">Save image</button></div>`,async e=>{
    if(e.target.dataset.sv){const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));saveFile('owenmore-result.png',blob,toast);return}
    if(!e.target.dataset.sh)return;
    try{const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const file=new File([blob],'result.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}
      if(navigator.share){await navigator.share({text});return}}catch(err){}
    toast('Sharing isn’t available here. Long-press the image to save it.')});
}

/* ========== brief v2: tap logs instantly, details after ========== */
const PICK_TYPES=['goal','point','two','wide','short','saved','tow','tol','yellow','black','red'];
const SHOT_TYPES=['goal','point','two','wide','short','saved'];
acts.tap=d=>{const m=active();if(!canScore(m))return;const side=d.side,type=d.type;
  if(type==='free'){openFree(m,side);return}
  if(type==='card'){openCardQ(m,side);return}
  const e=addEvent(Object.assign({side,type},SHOT_TYPES.includes(type)?{src:'play'}:{}));
  if(e&&side==='us'&&PICK_TYPES.includes(type))openAfter(m,e)};
function openFree(m,side){
  const t=team(m.teamId);const two=footy(m.code)&&m.arc;let kind='free';
  const draw=()=>{const res=kind==='45'?[['point',two?'Scored (2 pts)':'Scored'],['wide','Wide'],['short','Dropped short']]:[['goal','Goal'],['point','Point']].concat(two?[['two','2-Point']]:[]).concat([['wide','Wide'],['short','Short']]);
    sheet(`${sheetHead((side==='us'?S.club:m.opp)+': free')}
      <div class="seg big">${[['free','Free'],['45',set45(m.code)]].map(([k,l])=>`<button data-kind="${k}" aria-pressed="${kind===k}">${l}</button>`).join('')}</div>
      <div class="grp"><h3>Result</h3><div class="keys">${res.map(([k,l])=>`<button class="key k-${k}" data-res="${k}">${l}</button>`).join('')}</div></div>`,ev=>{
      const kd=ev.target.closest('[data-kind]');if(kd){kind=kd.dataset.kind;draw();return}
      const r=ev.target.closest('[data-res]');if(!r)return;let type=r.dataset.res;if(kind==='45'&&type==='point'&&two)type='two';
      const o={side,type,src:kind};if(kind==='45'){o.lx=40;o.ly=footy(m.code)?45:65}
      closeSheet();const e=addEvent(o,kind==='45'?set45(m.code):'Free');if(e&&side==='us')openAfter(m,e)})};
  draw();
}
function openCardQ(m,side){
  const t=team(m.teamId);const rule=OG.sinbinRule(t);
  sheet(`${sheetHead((side==='us'?S.club:m.opp)+': card')}
    <div class="keys cardsq">${['yellow'].concat(hasBlack(m.code)?['black']:[]).concat(['red']).map(k=>`<button class="key c-${k}" data-card="${k}">${k[0].toUpperCase()+k.slice(1)}${rule&&rule.card===k?`<small>sin-bin ${rule.secs/60} min</small>`:''}</button>`).join('')}</div>`,ev=>{
    const c=ev.target.closest('[data-card]');if(!c)return;const card=c.dataset.card;const o={side,type:card};if(rule&&rule.card===card)o.sinbin=rule.secs;
    closeSheet();const e=addEvent(o);if(e&&side==='us')openAfter(m,e)});
}
// After a tap: who (and for scores, where). Scores need both before the sheet closes.
function openAfter(m,e){
  const t=team(m.teamId);const shot=SHOT_TYPES.includes(e.type);const isSc=isScore(e.type);const is45=e.src==='45';
  const needLoc=isSc&&!is45,needWho=isSc;const onIds=[...OG.onPitch(m)];
  const draw=()=>{
    const done=(!needWho||e.pid)&&(!needLoc||hasLoc(e));
    const where=hasLoc(e)?`${Math.round(distM(e))}m, ${sideOf(e).toLowerCase()}`:'';
    const head=`<div class="row" style="justify-content:space-between"><h2>${esc(lbl(e.type,m.code))}${e.src&&e.src!=='play'?' · '+esc(srcL(e.src,m.code)):''} <small class="muted">${isPlaying(e.per)?OG.minOf(e.sec,OG.halfOf(m,e.per)):''}</small></h2>
      <button class="btn sm warn" data-undo="1">Undo</button></div>`;
    const missChips=['wide','short','saved'].includes(e.type)?`<div class="seg">${[['wide','Wide'],['short','Short'],['saved','Saved / blocked']].map(([k,l])=>`<button data-miss="${k}" aria-pressed="${e.type===k}">${l}</button>`).join('')}</div>`:'';
    const srcChips=shot&&!is45&&e.src!=='free'?`<div class="seg">${[['play','From play']].concat(footy(m.code)&&e.type!=='goal'?[['mark','Mark']]:[]).concat(e.type==='goal'||e.type==='wide'||e.type==='saved'?[['pen','Penalty']]:[]).map(([k,l])=>`<button data-src="${k}" aria-pressed="${(e.src||'play')===k}">${l}</button>`).join('')}</div>`:'';
    const sideChips=is45?`<div class="grp"><h3>Where</h3><div class="seg big">${['Left','Centre','Right'].map(k=>`<button data-s45="${k}" aria-pressed="${hasLoc(e)&&sideOf(e)===k}">${k}</button>`).join('')}</div></div>`:'';
    const pitch=shot&&!is45?`<div class="grp"><h3>Where${needLoc?' <span class="req">required</span>':' (optional)'}${where?' · '+esc(where):''}</h3><div class="pitchbox">${pitchSVG({code:m.code,arc:m.arc,mark:hasLoc(e)?e:null,id:'afterpitch'})}</div>${isSc&&m.arc&&footy(m.code)?'<p class="legend">Outside the arc counts 2 points automatically.</p>':''}</div>`:'';
    const who=`<div class="grp"><h3>Who${needWho?' <span class="req">required</span>':' (optional)'}</h3>${pgrid(t,onIds,new Set([e.pid]))}</div>`;
    const foot=done?`<div class="row"><button class="btn pri" data-done="1">Done</button>${needWho?'':'<button class="btn" data-done="1">Skip</button>'}</div>`
      :`<p class="legend">${needWho&&!e.pid&&needLoc&&!hasLoc(e)?'Tap where on the pitch, then who scored.':needLoc&&!hasLoc(e)?'Tap where on the pitch it was scored from.':'Pick who scored.'}</p>${needWho?'':'<div class="row"><button class="btn" data-done="1">Skip</button></div>'}`;
    const sh=document.getElementById('sheet');
    sh.innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog" aria-label="Details">${head}${missChips}${srcChips}${pitch}${sideChips}${who}${foot}</div></div>`;sh.hidden=false;
    const svg=document.getElementById('afterpitch');
    if(svg)svg.addEventListener('click',ev=>{const r=svg.getBoundingClientRect();if(!r.width)return;const D=DEPTH(m.code);
      e.lx=Math.round(Math.max(0,Math.min(PW,(ev.clientX-r.left)/r.width*PW))*2)/2;e.ly=Math.round(Math.max(0,Math.min(D,(ev.clientY-r.top)/r.height*D))*2)/2;
      if(m.arc&&footy(m.code)&&e.src!=='pen'){if(e.type==='point'&&outsideArc(e,m.code,m.arc))e.type='two';else if(e.type==='two'&&!outsideArc(e,m.code,m.arc))e.type='point'}
      syncResult(m);persist();draw()});
  };
  draw();
  document.getElementById('sheet').onclick=ev=>{
    const g=ev.target.closest.bind(ev.target);
    if(g('[data-undo]')){m.events=m.events.filter(x=>x!==e);audit(m,'Undid '+describe(m,e));closeSheet();syncResult(m);persist();render();toast('Undone');return}
    const mi=g('[data-miss]');if(mi){e.type=mi.dataset.miss;persist();draw();return}
    const sr=g('[data-src]');if(sr){e.src=sr.dataset.src;if(e.src==='pen'){e.lx=40;e.ly=11;if(e.type==='two')e.type='point'}persist();draw();return}
    const s4=g('[data-s45]');if(s4){e.lx=s4.dataset.s45==='Left'?14:s4.dataset.s45==='Right'?66:40;e.ly=footy(m.code)?45:65;persist();draw();return}
    const p=g('[data-pid]');if(p&&p.dataset.pid){e.pid=p.dataset.pid;persist();
      if((!needLoc||hasLoc(e))){closeSheet();render();toast(lbl(e.type,m.code)+' · '+pName(t,e.pid));return}draw();return}
    if(g('[data-done]')){if(needWho&&!e.pid)return;if(needLoc&&!hasLoc(e))return;closeSheet();render()}
  };
}
// re-open details for a logged event (Add / Change player)
acts.addPlayer=d=>{const m=active();const e=m&&m.events.find(x=>x.id===d.id);if(!e)return;if(canScore(m))openAfter(m,e);else openEdit(m,e,true)};

function openPin(f,matchId){

/* ========== chart helpers ========== */
const barRow=(label,v,max,shown,cls)=>`<div class="bar"><span class="lab">${label}</span><span class="trk"><i class="${cls||''}" style="width:${max?Math.max(2,Math.round(v*100/max)):0}%"></i></span><span class="v">${shown??v}</span></div>`;
const splitBar=(title,aL,a,bL,b)=>`<div class="split"><div class="hd"><span>${aL} <b>${a}</b></span><span>${title}</span><span><b>${b}</b> ${bL}</span></div><div class="trk"><i style="width:${a+b?a*100/(a+b):50}%"></i><i style="width:${a+b?b*100/(a+b):50}%"></i></div></div>`;
function formChart(games){
  const g=games.slice(-8);if(!g.length)return '<p class="empty">No results yet.</p>';
  const max=Math.max(...g.map(x=>Math.max(x.u.t,x.th.t)),1),W=320,H=150,bw=W/g.length,base=H-30;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="pitch" role="img" aria-label="Points for and against, last ${g.length} matches">`;
  for(const v of[0,.5,1]){const y=base-v*(base-12);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`}
  g.forEach((x,i)=>{const cx=i*bw+bw/2,hU=x.u.t/max*(base-12),hT=x.th.t/max*(base-12),w=Math.min(16,bw/3);
    s+=`<rect x="${cx-w-1}" y="${base-hU}" width="${w}" height="${hU}" rx="2" fill="var(--royal)"><title>${esc(fmtS(x.u)+' v '+x.m.opp)}</title></rect>`;
    s+=`<rect x="${cx+1}" y="${base-hT}" width="${w}" height="${hT}" rx="2" fill="var(--amber)"><title>${esc(x.m.opp+' '+fmtS(x.th))}</title></rect>`;
    s+=`<text x="${cx-w/2-1}" y="${base-hU-4}" text-anchor="middle" font-size="10" fill="var(--fg)">${x.u.t}</text><text x="${cx+w/2+1}" y="${base-hT-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.th.t}</text>`;
    s+=`<text x="${cx}" y="${H-14}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(x.m.opp.slice(0,9))}</text><text x="${cx}" y="${H-3}" text-anchor="middle" font-size="10" font-weight="700" fill="${x.k==='W'?'var(--good)':x.k==='L'?'var(--bad)':'var(--amber-text)'}">${x.k}</text>`});
  return s+'</svg><div class="pkey"><span><i style="background:var(--royal);border-radius:3px"></i>Us</span><span><i style="background:var(--amber);border-radius:3px"></i>Opposition</span></div>';
}
const pkey=arc=>`<div class="pkey"><span><i class="g"></i>Goal</span><span><i class="s"></i>Point</span>${arc?'<span><i class="two"></i>2-pointer</span>':''}<span><i class="m"></i>Missed</span></div>`;
const shotDots=(list,t)=>list.filter(x=>hasLoc(x.e)).map(x=>({lx:x.e.lx,ly:x.e.ly,cls:dotCls(x.e.type),t:lbl(x.e.type,x.m.code)+(x.e.src&&x.e.src!=='play'?' ('+srcL(x.e.src,x.m.code)+')':'')+(t&&x.e.pid?' · '+pName(t,x.e.pid):'')+' v '+x.m.opp}));
const halfTag=p=>`<span class="ht ${p===1||p===3?'h1':p===2||p===4?'h2':''}">${esc(OG.perShort(p))}</span>`;
const mapLink=f=>{const g=f.ground||(f.venue==='Home'?HOME_GROUND:'');return `<a href="${OG.mapUrl(g,f.opp)}" target="_blank" rel="noopener">${esc(g||f.opp+' (away)')} ↗</a>`};

/* ========== scorer screen ========== */
function boardHTML(m,t){
  const c=m.clock,us=score(m,'us'),th=score(m,'them'),gg=OG.tierOf(t)==='gogames';
  return `<div class="sb">
      <div class="us">${crestImg(S.club,'big')}<div class="tn">${esc(S.club)}<small>${esc(t.name)}</small></div>${gg?'':`<div class="sc">${fmtS(us)}</div><div class="tot">(${us.t})</div>`}</div>
      <div><div class="halfpill ${c.period===1||c.period===3?'h1':c.period===2||c.period===4?'':'ht0'}">${esc(OG.perShort(c.period))}</div><div id="clk" class="clock${c.running?'':' paused'}">${clockHTML(m)}</div><div id="over" class="over"></div></div>
      <div class="them">${crestImg(m.opp,'big')}<div class="tn">${esc(m.opp)}<small>Opposition</small></div>${gg?'':`<div class="sc">${fmtS(th)}</div><div class="tot">(${th.t})</div>`}</div>
    </div>${gg?'<p class="ggnote">Go Games: no scores are kept. Track minutes and subs only.</p>':''}`;
}
function sbPanel(m,t){
  const sbs=OG.sinbins(m,t).filter(x=>x.left>-30);
  const on=OG.onPitch(m);
  const bloods=m.events.filter(e=>e.type==='sub'&&e.blood&&!m.events.some(r=>r.type==='bloodret'&&r.ref===e.id)&&on.has(e.onId));
  if(!sbs.length&&!bloods.length)return '';
  return `<div class="sbpanel">${sbs.map(x=>`<div class="sbrow"><span class="cardico c-${x.e.type}"></span><span class="who">${esc(x.e.side==='us'?pName(t,x.e.pid)||S.club:m.opp)}</span><b data-sb="${x.e.id}">${x.left>0?mmss(x.left)+' left':'can return'}</b></div>`).join('')}
    ${bloods.map(e=>`<div class="sbrow"><span class="cardico blood"></span><span class="who">Blood sub: ${esc(pName(t,e.onId))} on for ${esc(pName(t,e.pid))}</span>${canScore(m)?`<button class="btn sm" data-act="bloodret" data-id="${e.id}">${esc(OG.first((player(t,e.pid)||{}).name)||'Player')} back on</button>`:''}</div>`).join('')}</div>`;
}
function lastBar(m,t){
  const e=m.events[m.events.length-1];if(!e)return '<div class="lastbar"><span class="muted">Nothing logged yet. Tap a button: it logs at once with the match time.</span></div>';
  return `<div class="lastbar"><span><b>${esc(lbl(e.type,m.code))}</b>${e.side==='them'?' · '+esc(m.opp):e.pid?' · '+esc(pName(t,e.pid)):''} <span class="muted">${isPlaying(e.per)?OG.minOf(e.sec,OG.halfOf(m,e.per)):''}</span></span>
    <span class="row">${e.side==='us'&&PICK_TYPES.includes(e.type)?`<button class="btn sm" data-act="addPlayer" data-id="${e.id}">${e.pid?'Change player':'Add player'}</button>`:''}<button class="btn sm amb" data-act="undo">Undo</button></span></div>`;
}
function vScorer(m){
  const t=team(m.teamId),c=m.clock,two=footy(m.code)&&m.arc,ko=KO(m.code),gg=OG.tierOf(t)==='gogames';
  const runLbl=c.period===0?'Throw-in':c.running?'Time off':'Time on';
  const nextLbl=c.period===0?'Start 1st half':c.period===1?(ui.armed==='next'?'Confirm half time':'Half time'):c.period==='HT'?'Start 2nd half':c.period===2?(ui.armed==='next'?'Confirm full time':'Full time'):c.period===3?(ui.armed==='next'?'Confirm ET half time':'ET half time'):c.period==='ETH'?'Start ET 2nd half':c.period===4?(ui.armed==='next'?'Confirm end of ET':'End extra time'):'';
  let ctrl;
  if(c.period==='FT'||c.period==='AET')ctrl=`<div class="ctrl">${c.period==='FT'&&!gg?`<button class="btn${A('et')}" data-act="et">${ui.armed==='et'?'Confirm extra time':'Extra time'}</button>`:''}<button class="btn run-off${A('finish')}" data-act="finish">${ui.armed==='finish'?'Confirm: finish match':'Finish match'}</button></div>`;
  else ctrl=`<div class="ctrl"><button class="btn ${c.running?'run-on':'run-off'}" data-act="run" ${c.period==='HT'||c.period==='ETH'?'disabled':''}>${runLbl}</button><button class="btn${A('next')}" data-act="next">${nextLbl}</button></div>
    ${isPlaying(c.period)?`<div class="row adj"><button class="btn sm" data-act="adj" data-v="-10">−10s</button><button class="btn sm" data-act="adj" data-v="10">+10s</button><button class="btn sm" data-act="adj" data-v="60">+1 min</button></div>`:''}`;
  const pre=c.period===0?`<section class="panel"><div class="ph"><h3>Starting team</h3><span class="chip ${m.lineup.length===t.onField?'w':'d'}">${m.lineup.length}/${t.onField} picked</span></div>
      <p class="legend">Tap to add or remove. Minutes played are worked out from this and the subs you log.</p>
      <div class="pgrid">${t.players.map(p=>`<button class="pbtn${m.lineup.includes(p.id)?' on':''}" data-act="lineup" data-pid="${p.id}"><b>${p.num}</b><span>${esc(p.name)}</span></button>`).join('')}</div>
      <label class="row muted" style="font-size:13px">Halves of <input type="number" min="1" max="45" value="${m.half}" data-chg="mhalf" style="width:60px" id="m-half"> min</label></section>`:'';
  const col=(side)=>{const sc=score(m,side),name=side==='us'?S.club:m.opp;
    const B=(type,label,cls)=>`<button class="key ${cls||''} k-${type}" data-act="tap" data-side="${side}" data-type="${type}">${label}</button>`;
    return `<div class="scol ${side}"><div class="shead"><span class="cslot">${crestImg(name,'mid')}</span><span class="sname">${esc(name)}</span><span class="sscore">${fmtS(sc)} <small>(${sc.t})</small></span></div>
      <div class="sgrid">${B('goal','Goal','score')}${B('point','Point','score')}${two?B('two','2-Point','score'):''}${B('wide','Wide','miss')}${B('free','Free','set')}${B('card','Card','cardk')}
      ${B('kow','KO won','ko')}${B('kol','KO lost','ko')}${B('tow','TO won','to')}${B('tol','TO lost','to')}</div></div>`};
  return `<section class="board clockbar"><div class="cl"><span class="halfpill ${c.period===1||c.period===3?'h1':c.period===2||c.period===4?'':'ht0'}">${esc(OG.perShort(c.period))}</span><div id="clk" class="clock${c.running?'':' paused'}">${clockHTML(m)}</div><div id="over" class="over"></div></div>
    <div id="alertbar" class="alertbar" hidden></div>${ctrl}</section>
  ${pre}
  ${sbPanel(m,t)}
  ${gg?`<section class="panel"><p class="ggnote dark">Go Games: no scores are kept. Track subs (for minutes) and notes only.</p></section>`:`<section class="scorepanel">${col('us')}${col('them')}</section>
  <p class="legend center">Each tap logs at once with the match time. For ${esc(S.club)} the player picker opens after; skip it if unsure. KO = ${ko}, TO = turnover.</p>`}
  ${lastBar(m,t)}
  <div class="keys two subnote"><button class="key sub" data-act="sub">Sub</button><button class="key note" data-act="note">Note</button></div>
  <section class="panel"><div class="ph"><h3>Timeline</h3><span class="legend">Tap an event to edit or undo it</span></div>${timeline(m,t,15,true)}</section>
  <section class="panel"><div class="ph"><h3>Scorer</h3><span class="chip w">${esc(me().name)}</span></div>
    <p class="legend">Only you can score this match${(fixture(m.fixtureId)||{}).pin?' (match PIN '+esc(fixture(m.fixtureId).pin)+', expires at full time)':''}. Everyone else sees it live but can't change it. Scoring keeps working with no signal.</p>
    <div class="row"><button class="btn" data-act="handover">Hand over scoring</button><button class="btn" data-act="closeMatch">Back to list</button></div></section>`;
}
function timeline(m,t,limit,editable){
  const evs=[...m.events].sort((a,b)=>OG.abs(m,b.per,b.sec)-OG.abs(m,a.per,a.sec)).slice(0,limit||9999);
  if(!evs.length)return '<p class="empty">Nothing logged yet.</p>';
  return `<div class="log">${evs.map(e=>{
    let who=e.side==='them'?esc(m.opp):esc(pName(t,e.pid)||(e.type==='note'?'':S.club));
    if(e.type==='sub')who=esc((pName(t,e.pid)||'?')+' off → '+(pName(t,e.onId)||'?')+' on'+(e.blood?' (blood)':''));
    if(e.type==='bloodret')who=esc((pName(t,e.onId)||'?')+' back on for '+(pName(t,e.pid)||'?'));
    const extra=(e.src&&e.src!=='play'?' · '+esc(srcL(e.src,m.code)):'')+(hasLoc(e)&&e.src!=='45'?' · '+Math.round(distM(e))+'m':'')+(e.sinbin?' · sin-bin '+e.sinbin/60+' min':'');
    const pts=isScore(e.type)?` <b class="num">+${OG.PTS[e.type]}</b>`:'';
    const body=e.type==='note'?`<b>Note</b><br><span class="notetxt">${esc(e.text)}</span>`:`<b>${esc(lbl(e.type,m.code))}</b>${pts}${extra}<br><span>${who}</span>`;
    const tag=editable?'button':'div';
    return `<${tag} class="ev ${e.side} t-${e.type}${isScore(e.type)&&e.side==='us'?' sc':''}${e.type==='note'?' nt':''}"${editable?` data-act="editEv" data-id="${e.id}"`:''}><div class="t">${halfTag(e.per)}<b>${isPlaying(e.per)?OG.minOf(e.sec,OG.halfOf(m,e.per)):''}</b></div><div class="what">${body}</div></${tag}>`}).join('')}</div>`;
}

/* ========== match centre (view-only live, or after full time) ========== */
const csvBox=()=>`<div class="grp"><p class="legend">Confirm the save when asked. You can also copy it and paste into Excel or Google Sheets.</p><textarea id="csvbox" rows="5" readonly>${esc(ui.csv)}</textarea><div class="row"><button class="btn sm" data-act="copyCsv">Copy CSV</button></div></div>`;
function vMatchCentre(m){
  const t=team(m.teamId),f=fixture(m.fixtureId)||{},gg=OG.tierOf(t)==='gogames',manage=canManage(m.teamId);
  const mins=OG.minutes(m,S.settings);const ms=OG.summary(m,'us');
  const rows=t.players.filter(p=>mins[p.id]>0||m.lineup.includes(p.id)).sort((a,b)=>(mins[b.id]||0)-(mins[a.id]||0));
  const sl=m.events.filter(e=>e.side==='us'&&SHOTS.includes(e.type)).map(e=>({e,m}));
  const live=!m.ended;
  return `<section class="board">${boardHTML(m,t)}
    ${live?`<div class="row" style="justify-content:space-between"><span class="chip">Being scored by ${esc(userName(m.scorer))}</span>${manage?`<button class="btn sm${A('takeover')}" data-act="takeover">${ui.armed==='takeover'?'Tap again to take over':'Take over scoring'}</button>`:''}</div>`
    :`<div class="row" style="justify-content:space-between"><span class="chip">${m.clock.period==='AET'?'Full time (after extra time)':'Full time'}</span><span class="legend" style="color:var(--on-band-muted)">${esc(f.comp||'')}</span></div>`}
  </section>
  <section class="panel"><div class="row">
    <button class="btn" data-act="closeMatch">← Back</button>
    ${m.ended&&!gg?'<button class="btn amb" data-act="share">Share result card</button>':''}
    ${manage?'<button class="btn" data-act="note">Add note</button><button class="btn" data-act="csvMatch">Export CSV</button>':''}
  </div>${ui.csv&&manage?csvBox():''}</section>
  ${m.ended&&manage?`<section class="panel"><div class="ph"><h3>Match report</h3><div class="row"><button class="btn sm" data-act="copyReport" data-pub="0">Copy</button><button class="btn sm" data-act="copyReport" data-pub="1">Copy public version</button></div></div>
    <div class="report">${esc(OG.report(S,m,false)).replace(/\n/g,'<br>')}</div>
    <p class="legend">Written automatically from the match log. The public version leaves out turnovers, subs, cards and notes, and follows the team's privacy setting for names.</p></section>`:''}
  ${manage?`<section class="panel"><h3>Minutes played</h3>
    <div class="tw"><table><thead><tr><th>Player</th><th>Started</th><th>Mins</th>${gg?'':'<th>Score</th>'}</tr></thead><tbody>
    ${rows.map(p=>{let g=0,pp=0;for(const e of m.events)if(e.side==='us'&&e.pid===p.id&&isScore(e.type)){if(e.type==='goal')g++;else pp+=OG.PTS[e.type]}
      return `<tr><td>#${p.num} ${esc(p.name)}</td><td>${m.lineup.includes(p.id)?'Yes':''}</td><td>${Math.round((mins[p.id]||0)/60)}</td>${gg?'':`<td>${g||pp?g+'-'+pad(pp):''}</td>`}</tr>`}).join('')}
    </tbody></table></div>
    <p class="legend">From the starting team and subs log, on playing time (minutes stop when the clock stops). Blood subs ${S.settings.bloodCounts?'count for the player who came on':'don’t count'}; sin-bin time ${S.settings.sinbinCounts?'counts':'doesn’t count'}. Change this under Admin → Data &amp; rules.</p></section>`:''}
  ${manage&&!gg?`<section class="panel"><h3>Match stats</h3><div class="kpis">
      <div class="kpi hi"><b>${pct(ms.scores,ms.shots)}</b><span>Shot conversion (${ms.scores}/${ms.shots})</span></div>
      <div class="kpi"><b>${ms.tow}–${ms.tol}</b><span>Turnovers won–lost</span></div>
      <div class="kpi"><b>${ms.kow}–${ms.kol}</b><span>Our ${KO(m.code)}s won–lost</span></div>
      <div class="kpi"><b>${ms.okw}–${ms.okl}</b><span>Their ${KO(m.code)}s: we won–they kept</span></div></div>
    ${sl.some(x=>hasLoc(x.e))?`<div class="pitchbox">${pitchSVG({code:m.code,arc:m.arc,dots:shotDots(sl,t)})}</div>${pkey(m.arc&&footy(m.code))}`:''}</section>`:''}
  <section class="panel"><div class="ph"><h3>Timeline</h3>${manage&&m.ended?'<span class="legend">Tap an event to correct it</span>':''}</div>${timeline(m,t,0,manage&&m.ended)}</section>
  ${manage?`<section class="panel"><h3>Audit trail</h3><div class="audit">${(m.audit||[]).slice().reverse().map(a=>`<div><span class="muted">${new Date(a.at).toLocaleString('en-IE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span> <b>${esc(a.who)}</b> ${esc(a.action)}</div>`).join('')||'<p class="empty">No changes recorded.</p>'}</div></section>`:''}`;
}

/* ========== live scores (view-only, every role) ========== */
function vLive(){
  const now=Date.now();const pub=demoPublic(S,now);ui.livePub=pub.matches;
  const card=lm=>{const m=S.matches.find(x=>x.id===lm.id)||(lm.example?dmExampleLive(S,now):null);const t=team(m?m.teamId:'')||{};const gg=lm.tier==='gogames';const c=lm.clock;
    const us=m&&OG.summary(m,'us'),th=m&&OG.summary(m,'them');const ko=KO(lm.code),black=lm.code==='football';
    const row=(a,l,b)=>`<div class="l">${a}</div><div class="m">${l}</div><div class="r">${b}</div>`;
    return `<article class="lcard">
      <div class="lhead"><span>${esc(lm.squad)}</span>${lm.example?'<span class="chip">Example</span>':''}<span class="chip live">Live</span></div>
      <div class="lsb">
        <div class="lteam">${crestImg(S.club,'mid')}<b>${esc(S.club)}</b>${gg?'':`<span class="lsc">${fmtS(lm.score.us)}</span><span class="ltot">(${lm.score.us.t})</span>`}</div>
        <div class="lmid"><span class="halfpill ${c.period===1||c.period===3?'h1':c.period===2||c.period===4?'':'ht0'}">${esc(OG.perShort(c.period))}</span><span class="lclk" data-lclk="${esc(lm.id)}">${isPlaying(c.period)?OG.minOf(c.elapsed,c.period<=2?lm.half:lm.etHalf||10):'–'}</span><span class="ladd" data-ladd="${esc(lm.id)}"></span></div>
        <div class="lteam">${crestImg(lm.opp,'mid')}<b>${esc(lm.opp)}</b>${gg?'':`<span class="lsc them">${fmtS(lm.score.them)}</span><span class="ltot">(${lm.score.them.t})</span>`}</div>
      </div>
      ${gg?'<p class="legend" style="text-align:center">Go Games: no scores are kept.</p>':`<div class="cmp">
        ${row(us.scores+'/'+us.shots,'Scores from shots',th.scores+'/'+th.shots)}
        ${row(us.wide,'Wides',th.wide)}
        ${row(us.y+(black?'/'+us.b:'')+'/'+us.r,'Cards Y/'+(black?'B/':'')+'R',th.y+(black?'/'+th.b:'')+'/'+th.r)}
      </div>
      <div class="lours"><span>Their ${ko}s won <b>${us.okw}</b></span><span>Turnovers <b>${us.tow}–${us.tol}</b></span><span>Our ${ko}s <b>${us.kow}/${us.kow+us.kol}</b></span></div>`}
      ${lm.sinbins&&lm.sinbins.length?`<p class="legend">Sin-bin: ${lm.sinbins.map(s=>esc((s.who||S.club)+' '+mmss(s.left))).join(', ')}</p>`:''}
      ${!lm.example&&canManage(t.id)?`<div class="row"><button class="btn sm" data-act="openMatch" data-id="${esc(lm.id)}">Open match</button></div>`:''}
    </article>`};
  const latest=S.fixtures.filter(f=>f.status==='played'&&f.result).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  return `<section class="panel"><div class="ph"><h2>Live scores</h2><button class="btn sm" data-act="tab" data-v="live">Refresh</button></div>
    ${pub.example?'<p class="legend">No match is being scored right now, so this shows an example. Start a match from the Match tab and it appears here.</p>':''}</section>
    ${pub.matches.map(card).join('')}
    <section class="panel"><h3>Latest results</h3>${latest.map(f=>{const t=team(f.teamId);const u=f.result.us,th=f.result.them;const k=u.t>th.t?'w':u.t<th.t?'l':'d';
      return `<div class="lres">${crestImg(f.opp)}<span class="lrt"><b>${esc(t.name)} v ${esc(f.opp)}</b><span class="muted">${new Date(f.date+'T12:00').toLocaleDateString('en-IE',{day:'numeric',month:'short'})}</span></span><span class="res">${fmtS(u)} – ${fmtS(th)}</span><span class="chip ${k}">${k==='w'?'W':k==='l'?'L':'D'}</span></div>`}).join('')||'<p class="empty">No results yet.</p>'}</section>`;
}

/* ========== match list ========== */
function vMatch(){
  const m=active();
  if(m)return canScore(m)?vScorer(m):vMatchCentre(m);
  const fx=visibleFixtures();
  const live=S.matches.filter(x=>!x.ended&&x.clock.period!==0&&fx.some(f=>f.id===x.fixtureId));
  const up=fx.filter(f=>f.status==='upcoming'||f.status==='live').filter(f=>!live.some(x=>x.fixtureId===f.id)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);
  const recent=fx.filter(f=>f.status==='played').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  return `${isScorer()?`<section class="panel"><h2>Hi ${esc(me().name)}</h2><p class="legend">These are the matches you've been asked to score. At the pitch, open one, pick the starting team, then tap Throw-in.</p></section>`:''}
  ${live.length?`<section class="panel"><h2>Live now</h2>${live.map(x=>{const t=team(x.teamId);const gg=OG.tierOf(t)==='gogames';return `<div class="fx"><div class="dt live"><span>Live</span><b>${gg?'–':score(x,'us').t}</b><span>v ${gg?'–':score(x,'them').t}</span></div><div class="body"><div class="opp">${crestImg(x.opp)}<span>${esc(t.name)} v ${esc(x.opp)}</span></div><p class="legend">Scorer: ${esc(userName(x.scorer))}</p><div class="row"><button class="btn sm pri" data-act="openMatch" data-id="${x.id}">${canScore(x)?'Resume scoring':'Watch'}</button></div></div></div>`}).join('')}</section>`:''}
  <section class="panel"><h2>${isScorer()?'Your matches':'Upcoming'}</h2>${up.length?up.map(f=>fxCard(f,true)).join(''):'<p class="empty">Nothing coming up.</p>'}</section>
  ${recent.length?`<section class="panel"><h2>Recent</h2>${recent.map(f=>fxCard(f,true)).join('')}</section>`:''}`;
}

function fxCard(f,compact){
  const t=team(f.teamId);const d=new Date(f.date+'T12:00');const gg=OG.tierOf(t)==='gogames';const manage=canManage(f.teamId);
  if(!compact&&ui.editFx===f.id&&manage){
    const scorers=S.users.filter(u=>u.role==='scorer'||u.role==='admin'||(u.role==='coach'&&u.teamId===f.teamId));
    return `<div class="fx"><div class="dt"><span>Edit</span></div><div class="body">
      <div class="row"><label class="f">Opposition<input id="e-opp-${f.id}" value="${esc(f.opp)}"></label><label class="f">Competition<input id="e-comp-${f.id}" value="${esc(f.comp||'')}"></label></div>
      <div class="row"><label class="f">Date<input id="e-date-${f.id}" type="date" value="${esc(f.date)}"></label><label class="f">Throw-in<input id="e-time-${f.id}" type="time" value="${esc(f.time||'')}"></label>
      <label class="f">Venue<select id="e-venue-${f.id}">${['Home','Away','Neutral'].map(v=>`<option ${f.venue===v?'selected':''}>${v}</option>`).join('')}</select></label></div>
      <div class="row"><label class="f">Ground<input id="e-ground-${f.id}" value="${esc(f.ground||'')}" placeholder="${f.venue==='Home'?esc(HOME_GROUND):'Pitch name'}"></label><label class="f">Referee<input id="e-ref-${f.id}" value="${esc(f.ref||'')}"></label>
      <label class="f">Scorer<select id="e-scorer-${f.id}"><option value="">Not assigned</option>${scorers.map(u=>`<option value="${u.id}" ${f.scorer===u.id?'selected':''}>${esc(u.label)}</option>`).join('')}</select></label></div>
      <div class="row"><button class="btn sm pri" data-act="saveFx" data-id="${f.id}">Save changes</button><button class="btn sm" data-act="editFx" data-id="${f.id}">Close</button>
      ${f.status==='upcoming'?`<button class="btn sm warn${A('cfx'+f.id)}" data-act="cancelFx" data-id="${f.id}">${ui.armed==='cfx'+f.id?'Tap to cancel fixture':'Cancel fixture'}</button>`:''}
      <button class="btn sm warn${A('dfx'+f.id)}" data-act="delFx" data-id="${f.id}">${ui.armed==='dfx'+f.id?'Tap to delete':'Delete'}</button></div></div></div>`;
  }
  const res=!gg&&f.result&&f.status==='played'?(()=>{const u=f.result.us,th=f.result.them;const k=u.t>th.t?'w':u.t<th.t?'l':'d';return `<span class="res">${fmtS(u)} (${u.t}) – ${fmtS(th)} (${th.t})</span> <span class="chip ${k}">${k==='w'?'Won':k==='l'?'Lost':'Draw'}</span>`})():'';
  const btn=f.status==='cancelled'?'':f.status==='played'?`<button class="btn sm" data-act="startFx" data-id="${f.id}">Open match</button>`:f.status==='live'?`<button class="btn sm pri" data-act="startFx" data-id="${f.id}">Open live match</button>`:(f.scorer===S.me||manage)?`<button class="btn sm pri${A('start'+f.id)}" data-act="startFx" data-id="${f.id}">${ui.armed==='start'+f.id?'Tap again to score it':'Score this match'}</button>`:'';
  const moved=f.prev?`<span class="chip d">Moved from ${esc(new Date(f.prev.date+'T12:00').toLocaleDateString('en-IE',{day:'numeric',month:'short'}))}${f.prev.time&&f.prev.time!==f.time?' '+esc(f.prev.time):''}</span>`:'';
  return `<div class="fx${f.status==='cancelled'?' cancelled':''}"><div class="dt"><span>${d.toLocaleDateString('en-IE',{weekday:'short'})}</span><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-IE',{month:'short'})}</span></div>
    <div class="body"><div class="opp">${crestImg(f.opp)}<span>${esc(t?t.name:'?')} v ${esc(f.opp)}</span></div>
    <div class="row">${f.time?`<span class="chip num">${esc(f.time)}</span>`:''}<span class="chip">${esc(f.venue||'')}</span>${f.comp?`<span class="chip">${esc(f.comp)}</span>`:''}${gg?'<span class="chip">Go Games</span>':''}${f.status==='live'?'<span class="chip live">Live</span>':''}${f.status==='cancelled'?'<span class="chip l">Cancelled</span>':''}${moved}${f.source?`<span class="chip src">${esc(f.source)}</span>`:''}${f.example?'<span class="chip">Example</span>':''}</div>
    <p class="legend">${mapLink(f)}${f.ref?' · Ref: '+esc(f.ref):''}${f.scorer?' · Scorer: '+esc(userName(f.scorer))+(manage&&f.pin&&!f.pinExpired&&f.status!=='played'?' (PIN '+esc(f.pin)+')':''):''}${t&&t.tableUrl&&!gg?` · <a href="${esc(t.tableUrl)}" target="_blank" rel="noopener">League table ↗</a>`:''}</p>
    ${res?`<div class="row">${res}</div>`:''}
    <div class="row">${btn}${compact||!manage?'':f.status==='cancelled'?`<button class="btn sm" data-act="cancelFx" data-id="${f.id}">Put back on</button>`:`<button class="btn sm" data-act="editFx" data-id="${f.id}">Edit</button>`}</div></div></div>`;
}
