<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132a86"><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Gaels Beo Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Owenmore Gaels shared theme: royal blue band + amber accents. Layout: blue header band with badge, one working column of panels. */
:root{
  --bg:#f1f3fa; --surface:#ffffff; --surface2:#ecf0f9; --line:#d3d9ea; --fg:#0f1a3a; --muted:#566079;
  --royal:#1f3fbf; --royal-2:#132a86; --royal-text:#1f3fbf; --royal-soft:#e3e9fb;
  --amber:#f5a800; --amber-ink:#1d1300; --amber-text:#9a6300; --amber-soft:#fff3d6;
  --them:#0d7d72; --good:#16884f; --bad:#cf3a2e; --card-y:#f2c200; --card-r:#cf3a2e; --card-b:#15171d;
  --pitch:#e6ecfb; --pitch-line:#a8b6df; --goal:#17a34a; --pointc:#ffffff; --point-edge:#0f1a3a; --two:#ff7a00; --miss:#b0122c; --on-band:#ffffff; --on-band-muted:rgba(255,255,255,.72);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070c1d; --surface:#0f1730; --surface2:#16203f; --line:#26335d; --fg:#e8ecf8; --muted:#98a3c4;
  --royal:#2f52d6; --royal-2:#14246a; --royal-text:#7e9bff; --royal-soft:#18245a;
  --amber:#ffb81f; --amber-ink:#1d1300; --amber-text:#ffc449; --amber-soft:#2e2510;
  --them:#33c4b2; --good:#3fd08a; --bad:#ff6a5e; --card-y:#ffd23f; --card-r:#ff6a5e; --card-b:#d4dae9;
  --pitch:#0c1636; --pitch-line:#33478a; --goal:#2fc766; --pointc:#ffffff; --point-edge:#0f1a3a; --two:#ff8a1f; --miss:#ff4d78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070c1d; --surface:#0f1730; --surface2:#16203f; --line:#26335d; --fg:#e8ecf8; --muted:#98a3c4;
  --royal:#2f52d6; --royal-2:#14246a; --royal-text:#7e9bff; --royal-soft:#18245a;
  --amber:#ffb81f; --amber-ink:#1d1300; --amber-text:#ffc449; --amber-soft:#2e2510;
  --them:#33c4b2; --good:#3fd08a; --bad:#ff6a5e; --card-y:#ffd23f; --card-r:#ff6a5e; --card-b:#d4dae9;
  --pitch:#0c1636; --pitch-line:#33478a; --goal:#2fc766; --pointc:#ffffff; --point-edge:#0f1a3a; --two:#ff8a1f; --miss:#ff4d78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--royal-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}

/* Header band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(120deg,var(--royal) 0%,var(--royal-2) 85%);color:var(--on-band);border-bottom:4px solid var(--amber)}
.top-in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:8px}
.badge{width:46px;height:46px;border-radius:10px;flex:none;background:var(--amber);color:var(--royal-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.badge img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand .bt{min-width:0;flex:1}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--on-band);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:flex;align-items:center;gap:6px;color:var(--on-band-muted);font-size:13px;margin-top:2px}
.brand a{color:var(--on-band)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:1;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-4px;padding:8px 6px 9px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.07em;text-transform:uppercase;color:var(--on-band-muted);white-space:nowrap}
nav button[aria-current="page"]{color:var(--on-band);border-bottom-color:var(--amber)}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--on-band-muted)}
.ldot[data-s=ok]{background:#46e08f}.ldot[data-s=err]{background:#ff6a5e}.ldot[data-s=wait]{background:var(--amber)}.ldot[data-s=off]{display:none}

/* Page column and panels */
main{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 80px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:0}
.empty{text-align:center;padding:16px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface2);white-space:nowrap}
.chip.w{color:var(--good);border-color:var(--good)} .chip.l{color:var(--bad);border-color:var(--bad)} .chip.d{color:var(--amber-text);border-color:var(--amber)}
.chip.live{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:600;color:var(--fg);text-decoration:none;display:inline-block}
.btn.pri{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.amb{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.armed{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;color:var(--fg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:1 1 140px;min-width:0}
label.f input,label.f select{font-size:15px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.hi{background:var(--royal);color:#fff}.kpi.hi span{color:rgba(255,255,255,.75)}
.kpi.am{background:var(--amber-soft)}.kpi.am b{color:var(--amber-text)}

/* Bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar .trk i{display:block;height:100%;background:var(--royal)}
.bar .trk i.a{background:var(--amber)} .bar .trk i.t{background:var(--them)} .bar .trk i.m{background:var(--line)}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.5em;text-align:right}
.split{display:flex;flex-direction:column;gap:4px}
.split .hd{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.split .hd b{color:var(--fg);font-variant-numeric:tabular-nums}
.split .trk{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface2)}
.split .trk i{display:block;height:100%}
.split .trk i:first-child{background:var(--royal)} .split .trk i:last-child{background:var(--amber)}

/* Pitch */
.pitch{width:100%;max-width:100%;display:block;touch-action:manipulation}
.pitch .grass{fill:var(--pitch)}
.pitch .ln{stroke:var(--pitch-line);stroke-width:1.5;fill:none}
.pitch .arc{stroke:var(--amber);stroke-width:2;fill:none;stroke-dasharray:6 4}
.pitch .l45{stroke:var(--royal-text);stroke-width:3}
.pitch .post{stroke:var(--royal-text);stroke-width:4}
.pitch .lbl{fill:var(--muted);font-size:10px;font-family:var(--body)}
.pitch .dot-s{fill:var(--amber);stroke:var(--royal-2);stroke-width:1.5}
.pitch .dot-g{fill:var(--royal);stroke:var(--amber);stroke-width:2.5}
.pitch .dot-2{fill:var(--amber);stroke:var(--fg);stroke-width:2.5}
.pitch .dot-m{fill:var(--surface);stroke:var(--bad);stroke-width:2}
.pitch .mark{fill:var(--amber);stroke:var(--fg);stroke-width:2}
.pkey{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.pkey i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.pkey .s{background:var(--amber);border:1.5px solid var(--royal-2)} .pkey .g{background:var(--royal);border:2px solid var(--amber)} .pkey .two{background:var(--amber);border:2px solid var(--fg)} .pkey .m{background:var(--surface);border:2px solid var(--bad)}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th:first-child{background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .pc{color:var(--muted);font-size:12px;margin-left:4px}

/* Form strip */
.form{display:flex;gap:6px;flex-wrap:wrap}
.form span{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:#fff}
.form .W{background:var(--good)} .form .L{background:var(--bad)} .form .D{background:var(--amber);color:var(--amber-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.grid2>*{min-width:0}

/* Score colour code: green goal, white point, orange 2-pointer, red miss */
.pitch .dot-g{fill:var(--goal);stroke:#fff;stroke-width:2}
.pitch .dot-s{fill:var(--pointc);stroke:var(--point-edge);stroke-width:1.8}
.pitch .dot-2{fill:var(--two);stroke:#fff;stroke-width:1.8}
.pitch .dot-m{fill:var(--miss);stroke:#fff;stroke-width:1.5}
.pkey .g{background:var(--goal);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pkey .s{background:var(--pointc);border:1.5px solid var(--point-edge)}
.pkey .two{background:var(--two);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pkey .m{background:var(--miss);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tag.goal{background:var(--goal)!important;color:#fff!important}
.tag.point{background:var(--pointc)!important;color:#0f1a3a!important;box-shadow:inset 0 0 0 1.5px var(--point-edge)}
.tag.two{background:var(--two)!important;color:#1d1000!important}
.tag.wide,.tag.short,.tag.saved{background:var(--miss)!important;color:#fff!important}
.ev.t-goal{border-left-color:var(--goal)!important}.ev.t-point{border-left-color:var(--point-edge)!important}.ev.t-two{border-left-color:var(--two)!important}.ev.t-wide,.ev.t-short,.ev.t-saved{border-left-color:var(--miss)!important}

.pitch .dot-x path{stroke:var(--miss);stroke-width:3;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 1px #fff)}
.pkey .m{background:none!important;border:0!important;box-shadow:none!important;position:relative}
.pkey .m::before,.pkey .m::after,.dotk.m::before,.dotk.m::after{content:"";position:absolute;left:50%;top:50%;width:13px;height:3px;background:var(--miss);border-radius:2px}
.pkey .m::before,.dotk.m::before{transform:translate(-50%,-50%) rotate(45deg)} .pkey .m::after,.dotk.m::after{transform:translate(-50%,-50%) rotate(-45deg)}
/* Player page */
.top-in{padding-block:10px}
main{max-width:660px}
.banner{background:var(--amber-soft);border:1px dashed var(--amber);border-radius:12px;padding:10px 12px;font-size:14px}
label.code{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
label.code input{font-size:24px;letter-spacing:.25em;text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 12px}
.err{color:var(--bad);font-weight:600;margin:0}
.hero{background:linear-gradient(140deg,var(--royal),var(--royal-2));color:#fff;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border-bottom:4px solid var(--amber)}
.hero .who{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero .num{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;width:74px;height:74px;border-radius:14px;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center}
.hero .who b{display:block;font-size:22px;font-weight:600;line-height:1.15}
.hero .who span{color:rgba(255,255,255,.75)}
.hero .season{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .season b{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.hero .season span{color:rgba(255,255,255,.8)}
.game{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.game:first-of-type{border-top:0}
.game .o b{font-weight:600} .game .o span{display:block;font-size:13px;color:var(--muted)}
.game .r{font-family:var(--display);font-size:17px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.game .r span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.game .line{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:2px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.s{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.pill.y{border-color:var(--card-y)} .pill.rd{border-color:var(--card-r)}
.pitchbox{max-width:420px;width:100%;margin:0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.w-W{color:var(--good)} .w-L{color:var(--bad)} .w-D{color:var(--amber-text)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.pick{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;text-align:left;color:var(--fg);min-width:0}
.pick b{font-family:var(--display);font-size:20px;color:var(--royal-text);min-width:1.4em}
.pick span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner a,.foot a{color:var(--royal-text);font-weight:600}
.brand small a{color:var(--on-band);font-weight:600}
.joinbox{background:var(--amber-soft);border-color:var(--amber)}
tr.meRow td{background:var(--amber-soft)!important;font-weight:700}
.game .r span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><div class="badge" id="badge" aria-hidden="true"><img src="badge.png" alt=""></div><div class="bt"><h1 id="club">Owenmore Gaels</h1><small><span>My stats</span> · <a href="live.html">Live scores</a> · <a href="index.html">Coach app</a></small></div></div>
</div></header>

const crestUrl = (c) => BASE + c.id + "/" + encodeURIComponent(c.f);

// Normalise a club name for matching: "St. Mary's" -> "st marys", "Calry/St. Joseph's" -> "calry/st josephs"
const norm = (s) => String(s || "").toLowerCase().replace(/[’'`.]/g, "").replace(/\b(gaa|gfc|lgfa|club|cumann)\b/g, "")
  .replace(/[^a-z0-9/ ]+/g, " ").replace(/\s*\/\s*/g, "/").replace(/\s+/g, " ").trim();

// Find the crest for a team name as written on fixtures (amalgamations use the first club).
function crestFor(name) {
  const n = norm(name); if (!n) return null;
  const names = (c) => [c.n, ...(c.a || [])].map(norm);
  for (const c of CRESTS) if (names(c).includes(n)) return c;
  const first = n.split("/")[0].trim();
  for (const c of CRESTS) if (names(c).includes(first)) return c;
  let best = null;
  for (const c of CRESTS) for (const cn of names(c).map((x) => x.split("/")[0].trim()))
    if (cn.length > 3 && (first.startsWith(cn) || cn.startsWith(first)) && (!best || cn.length > best.l)) best = { c, l: cn.length };
  return best ? best.c : null;
}
/* ===== Owenmore Gaels demo: shared model + example season =====

const DEMO_KEY='owenmore-gaels-demo-v2', DEMO_VER=6;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const mmss=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/60))+':'+pad(s%60)};
const HOME_GROUND='Connolly Park, Collooney';

const OG={};
OG.LABEL={goal:'Goal',point:'Point',two:'2-pointer',wide:'Wide',short:'Dropped short',saved:'Saved / blocked',w45:'45 won',
  fwon:'Free won',fcon:'Free conceded',kow:'Kick-out won',kol:'Kick-out lost',okw:'Their kick-out won',okl:'Their kick-out lost',
  tow:'Turnover won',tol:'Turnover lost',save:'Save',yellow:'Yellow card',black:'Black card',red:'Red card',sub:'Substitution',bloodret:'Blood sub return',note:'Note'};
OG.PTS={goal:3,point:1,two:2};
OG.SHOTS=['goal','point','two','wide','short','saved'];
OG.SRC={play:'Play',free:'Free','45':'45',pen:'Penalty',mark:'Mark'};
OG.isScore=t=>t==='goal'||t==='point'||t==='two';
OG.footy=code=>code!=='hurling';
OG.label=(t,code)=>{const l=OG.LABEL[t]||t;return code==='hurling'?l.replace('45 won','65 won').replace('kick-out','puck-out'):l};
OG.srcLabel=(s,code)=>s==='45'&&code==='hurling'?'65':OG.SRC[s]||'';
OG.set45=code=>OG.footy(code)?'45':'65';
OG.KO=code=>OG.footy(code)?'kick-out':'puck-out';
OG.score=(m,side)=>{let g=0,p=0;for(const e of m.events){if(e.side!==side)continue;if(e.type==='goal')g++;else if(e.type==='point')p++;else if(e.type==='two')p+=2}return{g,p,t:g*3+p}};
OG.fmt=s=>s.g+'-'+pad(s.p);
OG.scoreUpTo=(m,side,maxAbs)=>{let g=0,p=0;for(const e of m.events){if(e.side!==side||OG.abs(m,e.per,e.sec)>maxAbs)continue;if(e.type==='goal')g++;else if(e.type==='point')p++;else if(e.type==='two')p+=2}return{g,p,t:g*3+p}};
OG.TIERS={adult:'Adult',minor:'Minor',gogames:'Go Games'};

/* ----- periods and match time -----
   period: 0 pre-match, 1, 'HT', 2, 'FT', 3 (ET 1st), 'ETH', 4 (ET 2nd), 'AET' */
OG.perLen=(m,p)=>(p<=2?m.half:(m.etHalf||10))*60;
OG.dur=(m,p)=>{const d=m.clock&&m.clock.durs&&m.clock.durs[p];return typeof d==='number'?d:OG.perLen(m,p)};
OG.before={0:0,1:0,HT:1,2:1,FT:2,3:2,ETH:3,4:3,AET:4};
OG.abs=(m,per,sec)=>{let t=0;const n=OG.before[per]??0;for(let p=1;p<=n;p++)t+=OG.dur(m,p);return t+(typeof per==='number'&&per>0?sec:0)};
OG.elapsed=(m,now)=>{const c=m.clock;return c.acc+(c.running?((now||Date.now())-c.since)/1000:0)};
OG.nowAbs=(m,now)=>{const c=m.clock;return typeof c.period==='number'&&c.period>0?OG.abs(m,c.period,OG.elapsed(m,now)):OG.abs(m,c.period,0)};
OG.minOf=(sec,half)=>{const mn=Math.floor(sec/60)+1;return half&&mn>half?half+'+'+(mn-half)+"'":mn+"'"};
OG.perShort=p=>p===1?'1st half':p===2?'2nd half':p===3?'ET 1st':p===4?'ET 2nd':p==='HT'?'Half time':p==='FT'?'Full time':p==='ETH'?'ET half time':p==='AET'?'After ET':'Pre-match';
OG.halfOf=(m,per)=>per<=2?m.half:(m.etHalf||10);
// running match minute for reports, e.g. 38' or 60+2'
OG.matchMin=(m,e)=>{const mn=Math.floor(e.sec/60)+1,h=OG.halfOf(m,e.per);const base=e.per===2?m.half:e.per===3?2*m.half:e.per===4?2*m.half+(m.etHalf||10):0;
  return mn>h?(base+h)+'+'+(mn-h)+"'":(base+mn)+"'"};

/* ----- privacy tiers and names ----- */
OG.tierOf=t=>t&&t.tier||'adult';
OG.first=n=>String(n||'').split(' ')[0];
OG.pubName=(t,pid)=>{const p=t&&t.players.find(x=>x.id===pid);if(!p)return '';const tier=OG.tierOf(t);return tier==='adult'?`#${p.num} ${p.name}`:tier==='minor'?`#${p.num} ${OG.first(p.name)}`:''};
OG.fullName=(t,pid)=>{const p=t&&t.players.find(x=>x.id===pid);return p?`#${p.num} ${p.name}`:''};

/* ----- sin-bin ----- */
OG.sinbinRule=t=>{ // which card sends a player to the sin-bin, and for how long
  if(t.sinbinCard==='none')return null;
  const card=t.sinbinCard||(t.assoc==='gaa_f'?'black':t.assoc==='lgfa'?'yellow':'none');if(card==='none')return null;
  if(t.assoc==='lgfa'&&OG.gradeAge(t.grade)<=13)return null; // LGFA Rule 408: no sin-bin up to U13
  const mins=t.sinbinMins||(t.assoc==='lgfa'?(t.half>=30?10:t.half>15?5:3):10);
  return{card,secs:mins*60};
};
OG.gradeAge=g=>/minor/i.test(g)?(/18/.test(g)?18:17):/adult/i.test(g)?99:parseInt(String(g).replace(/\D/g,''))||0;
OG.sinbins=(m,t,now)=>{ // active sin-bins with seconds left (playing time)
  const na=OG.nowAbs(m,now),out=[];
  for(const e of m.events){if(!e.sinbin)continue;const left=e.sinbin-(na-OG.abs(m,e.per,e.sec));if(left>-30)out.push({e,left})}
  return out;
};

/* ----- minutes played (from starting team + subs log) ----- */
OG.minutes=(m,rules,now)=>{
  rules=rules||{bloodCounts:true,sinbinCounts:false};
  const end=m.ended||m.clock.period==='FT'||m.clock.period==='AET'?OG.abs(m,m.clock.period==='AET'?'AET':'FT',0):OG.nowAbs(m,now);
  const ev=[];for(const e of m.events)if(e.side==='us'&&['sub','bloodret','red'].includes(e.type)||e.side==='us'&&e.sinbin)ev.push({t:OG.abs(m,e.per,e.sec),e});
  if(!rules.sinbinCounts)for(const x of ev.slice())if(x.e.sinbin)ev.push({t:x.t+x.e.sinbin,e:{type:'sinret',pid:x.e.pid}});
  ev.sort((a,b)=>a.t-b.t);
  const secs={},since={},blood=new Set(),off=new Set();
  const open=(pid,t)=>{if(pid&&!(pid in since)&&!off.has(pid))since[pid]=t};
  const close=(pid,t)=>{if(pid in since){const d=Math.max(0,Math.min(t,end)-since[pid]);if(!blood.has(pid)||rules.bloodCounts)secs[pid]=(secs[pid]||0)+d;delete since[pid]}};
  (m.lineup||[]).forEach(pid=>open(pid,0));
  for(const {t,e} of ev){if(t>end)break;
    if(e.type==='sub'){close(e.pid,t);if(e.blood)blood.add(e.onId);open(e.onId,t)}
    else if(e.type==='bloodret'){close(e.pid,t);open(e.onId,t)}
    else if(e.type==='red'){close(e.pid,t);off.add(e.pid)}
    else if(e.sinbin&&!rules.sinbinCounts)close(e.pid,t);
    else if(e.type==='sinret')open(e.pid,t);
  }
  for(const pid of Object.keys(since))close(pid,end);
  return secs;
};
OG.onPitch=(m)=>{ // who's on the pitch after the subs/reds logged so far
  const set=new Set(m.lineup||[]);
  const ev=m.events.filter(e=>e.side==='us'&&['sub','bloodret','red'].includes(e.type)).sort((a,b)=>OG.abs(m,a.per,a.sec)-OG.abs(m,b.per,b.sec));
  for(const e of ev){if(e.type==='red')set.delete(e.pid);else{set.delete(e.pid);if(e.onId)set.add(e.onId)}}
  return set;
};

/* ----- tallies ----- */
OG.blank=()=>{const r={scoreG:0,scoreP:0,pts:0,fromFree:0,from45:0,fromPen:0,subOn:0,subOff:0,t45:0,s45:0,twoAtt:0};for(const k in OG.LABEL)r[k]=0;return r};
OG.outsideArc=(e,m)=>OG.footy(m.code)&&m.arc&&typeof e.lx==='number'&&Math.hypot(e.lx-40,e.ly)>=40;
OG.tally=(r,e,m)=>{if(e.type in r)r[e.type]++;
  if(OG.SHOTS.includes(e.type)){if(e.src==='45'){r.t45++;if(OG.PTS[e.type])r.s45++}if(e.type==='two'||OG.outsideArc(e,m))r.twoAtt++}
  if(OG.PTS[e.type]){r.pts+=OG.PTS[e.type];if(e.type==='goal')r.scoreG++;else r.scoreP+=OG.PTS[e.type];if(e.src==='free')r.fromFree++;if(e.src==='45')r.from45++;if(e.src==='pen')r.fromPen++}};
// A turnover won by one team is a turnover lost by the other; their kick-out lost is one we won.
OG.cross=(r,e)=>{if(e.type==='kow')r.okl++;else if(e.type==='kol')r.okw++;else if(e.type==='tow')r.tol++;else if(e.type==='tol')r.tow++;else if(e.type==='okw')r.kol++;else if(e.type==='okl')r.kow++};
OG.summary=(m,side)=>{const r=OG.blank();for(const e of m.events){if(e.side===side)OG.tally(r,e,m);else OG.cross(r,e)}
  return{scores:r.goal+r.point+r.two,shots:OG.SHOTS.reduce((a,t)=>a+r[t],0),wide:r.wide,tow:r.tow,tol:r.tol,kow:r.kow,kol:r.kol,okw:r.okw,okl:r.okl,fwon:r.fwon,fcon:r.fcon,y:r.yellow,b:r.black,r:r.red,save:r.save}};

/* ----- match report ----- */
OG.report=(S,m,publicVersion)=>{
  const t=S.teams.find(x=>x.id===m.teamId),f=S.fixtures.find(x=>x.id===m.fixtureId)||{};
  const nm=pid=>publicVersion?OG.pubName(t,pid):OG.fullName(t,pid);
  const us=OG.score(m,'us'),th=OG.score(m,'them'),ht1=OG.scoreUpTo(m,'us',OG.abs(m,'HT',0)),ht2=OG.scoreUpTo(m,'them',OG.abs(m,'HT',0));
  const aet=m.events.some(e=>e.per===3||e.per===4)||m.clock.period==='AET';
  const res=us.t>th.t?'beat':us.t<th.t?'lost to':'drew with';
  const d=new Date(m.date+'T12:00').toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long'});
  const where=f.ground||(f.venue==='Home'?HOME_GROUND:'');
  let s=`${S.club} ${t.name} ${res} ${m.opp}, ${OG.fmt(us)} (${us.t}) to ${OG.fmt(th)} (${th.t})${aet?' after extra time':''}`;
  s+=` in the ${f.comp||'match'}${where?' at '+where:''} on ${d}.`;
  if(OG.tierOf(t)==='gogames')return `${S.club} ${t.name} played ${m.opp} in a Go Games fixture on ${d}${where?' at '+where:''}. Go Games are non-competitive, so no scores are recorded.`;
  s+=` The half-time score was ${OG.fmt(ht1)} to ${OG.fmt(ht2)}.`;
  const sc={};for(const e of m.events)if(e.side==='us'&&OG.isScore(e.type)&&e.pid){const r=sc[e.pid]||(sc[e.pid]={g:0,p:0,b:{}});if(e.type==='goal')r.g++;else r.p+=OG.PTS[e.type];
    const k=e.src==='free'?'f':e.src==='45'?OG.set45(m.code):e.src==='pen'?'pen':e.src==='mark'?'m':null;if(k){const b=r.b[k]||(r.b[k]={g:0,p:0});if(e.type==='goal')b.g++;else b.p+=OG.PTS[e.type]}}
  const list=Object.entries(sc).sort((a,b)=>(b[1].g*3+b[1].p)-(a[1].g*3+a[1].p)).map(([pid,r])=>{const br=Object.entries(r.b).map(([k,b])=>`${b.g}-${b.p} ${k}`);return `${nm(pid).replace(/^#\d+ /,'')||'Unknown'} ${r.g}-${pad(r.p)}${br.length?' ('+br.join(', ')+')':''}`});
  if(list.length)s+=`\n\nScorers: ${list.join(', ')}.`;
  const S1=OG.summary(m,'us'),S2=OG.summary(m,'them');
  s+=`\n\nShooting: ${S1.scores} scores from ${S1.shots} shots (${S1.shots?Math.round(S1.scores*100/S1.shots):0}%), ${S1.wide} wides. ${m.opp}: ${S2.wide} wides.`;
  if(!publicVersion){
    s+=` Turnovers ${S1.tow} won, ${S1.tol} lost. Own ${OG.KO(m.code)}s ${S1.kow}/${S1.kow+S1.kol} kept; won ${S1.okw} of theirs.`;
    const subs=m.events.filter(e=>e.side==='us'&&e.type==='sub').map(e=>`${OG.matchMin(m,e)} ${nm(e.onId).replace(/^#\d+ /,'')} for ${nm(e.pid).replace(/^#\d+ /,'')}${e.blood?' (blood)':''}`);
    if(subs.length)s+=`\n\nSubs: ${subs.join('; ')}`;
    const cards=m.events.filter(e=>['yellow','black','red'].includes(e.type)).map(e=>`${OG.label(e.type,m.code).replace(' card','')} ${e.side==='us'?nm(e.pid).replace(/^#\d+ /,''):m.opp} ${OG.matchMin(m,e)}${e.sinbin?' (sin-bin)':''}`);
    if(cards.length)s+=`\nCards: ${cards.join('; ')}`;
    const notes=m.events.filter(e=>e.type==='note').map(e=>`${OG.matchMin(m,e)} ${e.text}`);
    if(notes.length)s+=`\n\nNotes: ${notes.join(' / ')}`;
  }
  return s;
};

function dmGen(t,res,R,by){

  const loc=(a,b)=>{for(;;){const dd=a+R()*(b-a),an=(R()*2-1)*1.15,lx=40+dd*Math.sin(an),ly=dd*Math.cos(an);if(lx>2&&lx<78&&ly>1&&ly<54)return{lx:Math.round(lx*2)/2,ly:Math.round(ly*2)/2}}};

  for(let i=0,k=1+Math.floor(R()*2);i<k;i++){const w=pickTime(false);add(Object.assign({side:'us',type:'note',text:DM_NOTES[Math.floor(R()*DM_NOTES.length)]},w))}
  ev.sort((a,b)=>OG.abs(m,a.per,a.sec)-OG.abs(m,b.per,b.sec));
  return{events:ev,lineup,durs:d,hasET};
}

/* ===== what the public page and player page see ===== */
function dmExampleLive(S,now){
  const t=S.teams.find(x=>x.id==='u20');const R=dmRng(4242);
  const g=dmGen(t,{us:[1,12],them:[1,9],date:new Date(now).toISOString().slice(0,10),time:'16:00'},R,'Áine');
  const m={id:'example-live',teamId:t.id,opp:'Geevagh/St Michaels',date:new Date(now).toISOString().slice(0,10),half:t.half,etHalf:t.etHalf,code:t.code,arc:t.arc,lineup:g.lineup,events:[],example:true,clock:{period:2,running:true,acc:0,since:now,durs:{1:g.durs[1]}}};
  const at=Math.floor(now/1000)%1800;m.clock.acc=at;
  m.events=g.events.filter(e=>e.per===1||(e.per===2&&e.sec<=at));
  return m;
}
OG.publicMatch=(S,m,now)=>{const t=S.teams.find(x=>x.id===m.teamId)||{players:[]};const tier=OG.tierOf(t);const gg=tier==='gogames';
  const c=m.clock;const el=typeof c.period==='number'&&c.period>0?OG.elapsed(m,now):0;
  return{id:m.id,club:S.club,squad:t.name,tier,code:m.code,arc:!!m.arc,opp:m.opp,date:m.date,half:m.half,etHalf:m.etHalf,savedAt:now,example:!!m.example,
    clock:{period:c.period,running:!!c.running,elapsed:el},
    score:gg?null:{us:OG.score(m,'us'),them:OG.score(m,'them')},stats:gg?null:{us:OG.summary(m,'us'),them:OG.summary(m,'them')},
    sinbins:gg?[]:OG.sinbins(m,t,now).filter(x=>x.left>0).map(x=>({side:x.e.side,who:x.e.side==='us'?OG.pubName(t,x.e.pid):m.opp,left:x.left})),
    events:m.events.filter(e=>e.type!=='note'&&(!gg||e.type==='sub')).map(e=>({per:e.per,sec:e.sec,side:e.side,type:e.type,label:OG.label(e.type,m.code),pts:OG.PTS[e.type]||0,blood:!!e.blood,
      src:e.src&&e.src!=='play'?OG.srcLabel(e.src,m.code):null,sinbin:e.sinbin||0,
      who:e.side==='them'?'':e.type==='sub'||e.type==='bloodret'?`${OG.pubName(t,e.pid)||'?'} off, ${OG.pubName(t,e.onId)||'?'} on`:OG.pubName(t,e.pid)}))}};
function demoPublic(S,now=Date.now()){
  const byId=Object.fromEntries(S.teams.map(t=>[t.id,t]));
  let live=S.matches.filter(m=>!m.ended&&m.clock.period!==0);let example=false;
  if(!live.length){live=[dmExampleLive(S,now)];example=true}
  const fixtures=S.fixtures.map(f=>{const t=byId[f.teamId]||{};const gg=OG.tierOf(t)==='gogames';
    return{id:f.id,squad:t.name||'',tier:OG.tierOf(t),opp:f.opp,date:f.date,time:f.time||'',venue:f.venue||'',ground:f.ground||(f.venue==='Home'?HOME_GROUND:''),comp:f.comp||'',ref:f.ref||'',status:f.status,
      result:gg?null:f.result||null,prev:f.prev||null,changedAt:f.changedAt||null,example:!!f.example,tableUrl:t.tableUrl||''}});
  const updates=[];
  for(const f of fixtures){
    if(f.status==='cancelled'&&f.changedAt)updates.push({at:f.changedAt,kind:'cancelled',f});
    else if(f.prev&&f.changedAt)updates.push({at:f.changedAt,kind:'moved',f});
    if(f.status==='played'&&f.result&&now-Date.parse(f.date+'T18:00:00Z')<21*86400e3)updates.push({at:Date.parse(f.date+'T18:00:00Z'),kind:'result',f});
  }
  updates.sort((a,b)=>b.at-a.at);
  return{now,club:S.club,example,settings:S.settings,matches:live.map(m=>OG.publicMatch(S,m,now)),fixtures,updates:updates.slice(0,12)};
}
function demoPlayer(S,code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  let team,player;for(const t of S.teams){const p=t.players.find(x=>x.code===code);if(p){team=t;player=p;break}}
  if(!player)return null;
  const tier=OG.tierOf(team),gg=tier==='gogames';
  const total=OG.blank(),games=[],shots=[];let mins=0,apps=0;
  const board={};team.players.forEach(p=>board[p.id]={p,pts:0,g:0,pp:0,apps:0,mins:0});
  for(const m of S.matches.filter(x=>x.teamId===team.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)))){
    const ms=OG.minutes(m,S.settings);
    for(const [pid,s] of Object.entries(ms))if(board[pid]){board[pid].mins+=s;if(s>0)board[pid].apps++}
    for(const e of m.events)if(e.side==='us'&&OG.isScore(e.type)&&board[e.pid]){board[e.pid].pts+=OG.PTS[e.type];if(e.type==='goal')board[e.pid].g++;else board[e.pid].pp+=OG.PTS[e.type]}
    const line=OG.blank();let inv=(ms[player.id]||0)>0;
    for(const e of m.events){if(e.side!=='us')continue;
      if(e.type==='sub'){if(e.pid===player.id)line.subOff++;if(e.onId===player.id)line.subOn++;continue}
      if(e.pid===player.id&&!gg){OG.tally(line,e,m);inv=true;if(OG.SHOTS.includes(e.type)&&typeof e.lx==='number')shots.push({type:e.type,lx:e.lx,ly:e.ly})}}
    if(!inv)continue;for(const k in line)total[k]+=line[k];
    const mm=Math.round((ms[player.id]||0)/60);mins+=mm;if(mm>0)apps++;
    const fx=S.fixtures.find(f=>f.id===m.fixtureId);
    games.push({date:m.date,opp:m.opp,comp:fx?fx.comp:'',result:gg?null:{us:OG.score(m,'us'),them:OG.score(m,'them')},final:!!m.ended,line,mins:mm,started:(m.lineup||[]).includes(player.id)});
  }
  const lb=team.leaderboard&&!gg?Object.values(board).filter(r=>r.apps).map(r=>({name:tier==='adult'?r.p.name:OG.first(r.p.name),num:r.p.num,me:r.p.id===player.id,g:r.g,p:r.pp,pts:r.pts,apps:r.apps,mins:Math.round(r.mins/60)})):null;
  return{club:S.club,squad:team.name,tier,code:team.code,arc:!!team.arc,player:{num:player.num,name:player.name},games:games.length,apps,mins,total,matches:games,shots,leaderboard:lb,settings:S.settings};
}
OG.mapUrl=(ground,opp)=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((ground||(opp+' GAA'))+', Co. Sligo');

/* ===== shareable result card (canvas) ===== */
OG.resultCard=(o)=>new Promise(res=>{
  const c=document.createElement('canvas');c.width=1080;c.height=1080;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1080,1080);g.addColorStop(0,'#1f3fbf');g.addColorStop(1,'#0d1f6b');x.fillStyle=g;x.fillRect(0,0,1080,1080);
  x.fillStyle='#f5a800';x.fillRect(0,1040,1080,40);
  const draw=img=>{
    if(img){x.fillStyle='#fff';x.beginPath();x.arc(540,210,120,0,Math.PI*2);x.fill();const s=Math.min(200/img.width,200/img.height);x.drawImage(img,540-img.width*s/2,210-img.height*s/2,img.width*s,img.height*s)}
    x.textAlign='center';x.fillStyle='rgba(255,255,255,.8)';x.font='600 40px "Barlow Condensed", Arial Narrow, sans-serif';
    x.fillText((o.label||'FULL TIME').toUpperCase(),540,400);
    x.fillStyle='#fff';x.font='700 58px "Barlow Condensed", Arial Narrow, sans-serif';
    x.fillText(o.us,540,490);x.fillText(o.them,540,790);
    x.fillStyle='#f5a800';x.font='700 160px "Barlow Condensed", Arial Narrow, sans-serif';x.fillText(o.usScore,540,650);
    x.fillStyle='#fff';x.font='700 120px "Barlow Condensed", Arial Narrow, sans-serif';x.fillText(o.themScore,540,930);
    x.fillStyle='rgba(255,255,255,.75)';x.font='500 34px Barlow, Arial, sans-serif';x.fillText(o.sub||'',540,1000);
    res(c);
  };
  const img=new Image();img.onload=()=>draw(img);img.onerror=()=>draw(null);img.src=OWN_BADGE;
});

function crestTag(name,cls){const c=crestFor(name);if(!c)return '';const src=c.id===81481?OWN_BADGE:crestUrl(c);return `<img class="crest ${cls||''}" src="${src}" alt="" loading="lazy" onerror="this.remove()">`}
/* ===== player / parent page: one player's own stats ===== */
const PKEY='owenmore-gaels-player-code';
const st={get(){try{return localStorage.getItem(PKEY)||''}catch(e){return ''}},set(v){try{v?localStorage.setItem(PKEY,v):localStorage.removeItem(PKEY)}catch(e){}}};
let err='';
const app=document.getElementById('app');
const clean=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
function pitchSVG(code,arc,shots){
  const D=OG.footy(code)?55:70,Sx=4,w=320,h=D*Sx,X=m=>m*Sx;
  let s=`<svg class="pitch" viewBox="0 0 ${w} ${h}" role="img" aria-label="Your shots, attacking goal at the top"><rect class="grass" x="0" y="0" width="${w}" height="${h}"/>`;
  s+=`<rect class="ln" x="${X(30.5)}" y="0" width="${X(19)}" height="${X(13)}"/><rect class="ln" x="${X(33)}" y="0" width="${X(14)}" height="${X(4.5)}"/><path class="ln" d="M${X(27)} ${X(20)} A${X(13)} ${X(13)} 0 0 0 ${X(53)} ${X(20)}"/>`;
  for(const m of[13,20,45,65])if(m<D)s+=`<line class="ln" x1="0" y1="${X(m)}" x2="${w}" y2="${X(m)}"/><text class="lbl" x="${w-4}" y="${X(m)-4}" text-anchor="end">${m}m</text>`;
  if(OG.footy(code)&&arc)s+=`<path class="arc" d="M0 0 A${X(40)} ${X(40)} 0 0 0 ${w} 0"/>`;
  s+=`<line class="post" x1="${X(36.75)}" y1="2" x2="${X(43.25)}" y2="2"/>`;
  for(const e of shots){const x=e.lx*Sx,y=e.ly*Sx;if(!['goal','point','two'].includes(e.type)){s+=`<g class="dot-x"><path d="M${x-5} ${y-5}L${x+5} ${y+5}M${x+5} ${y-5}L${x-5} ${y+5}"/></g>`;continue}s+=`<circle class="${e.type==='goal'?'dot-g':e.type==='two'?'dot-2':'dot-s'}" cx="${x}" cy="${y}" r="${e.type==='goal'?7:5.5}"/>`}
  return s+'</svg>';
}
function joinRow(s){return `<div class="row">${s&&s.joinUrl?`<a class="btn amb" href="${esc(s.joinUrl)}" target="_blank" rel="noopener">Join / Renew on Foireann ↗</a>`:''}${s&&s.lottoUrl?`<a class="btn" href="${esc(s.lottoUrl)}" target="_blank" rel="noopener">Club lotto ↗</a>`:''}</div>`}
function vCode(){
  const S=loadDemo();
  app.innerHTML=`<section class="panel"><h2>My stats</h2>
    <p class="legend">Each player (or their parent) opens this page with a private code from the coach and sees only their own stats. For minors, nothing here is public.</p>
    <label class="code">Player code<input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123"></label>
    ${err?`<p class="err" role="alert">${esc(err)}</p>`:''}
    <div class="row"><button class="btn pri" id="go">Show my stats</button></div></section>
  <section class="panel"><h3>Demo: pick a player</h3><p class="legend">Picking a player here stands in for logging in with their code.</p></section>
  ${S.teams.map(t=>`<section class="panel"><div class="ph"><h3>${esc(t.name)}</h3><span class="chip">${OG.TIERS[OG.tierOf(t)]}</span></div><div class="pickgrid">${t.players.map(p=>`<button class="pick" data-code="${esc(p.code)}"><b>${p.num}</b><span>${esc(p.name)}</span></button>`).join('')}</div></section>`).join('')}`;
  const i=document.getElementById('code');
  document.getElementById('go').onclick=()=>look(i.value);
  i.onkeydown=e=>{if(e.key==='Enter')look(i.value)};
  app.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>look(b.dataset.code));
}
function look(code){
  code=clean(code);if(code.length!==6){err='Codes are 6 letters and numbers.';vCode();return}
  const j=demoPlayer(loadDemo(),code);
  if(!j){err='That code doesn’t match a player. Check it with your coach.';st.set('');vCode();return}
  err='';st.set(code);try{history.replaceState(null,'','?code='+code)}catch(e){}show(j);window.scrollTo(0,0);
}
function show(d){
  document.getElementById('club').textContent=d.club;document.title='My '+d.club+' Stats';
  const t=d.total,F=OG.footy(d.code),s45=OG.set45(d.code),arc=F&&d.arc,gg=d.tier==='gogames';
  const shotsTaken=OG.SHOTS.reduce((a,k)=>a+t[k],0),scoresN=t.goal+t.point+t.two;
  const line=g=>{const l=g.line,ps=[];
    ps.push(`<span class="pill">${g.mins} min${g.started?'':' (sub)'}</span>`);
    if(!gg){if(l.goal||l.point||l.two)ps.push(`<span class="pill s">${l.scoreG}-${pad(l.scoreP)}</span>`);
      const add=(n,lab,cls)=>{if(n)ps.push(`<span class="pill ${cls||''}">${n} ${lab}</span>`)};
      add(l.wide,l.wide===1?'wide':'wides');add(l.short,'short');add(l.saved,'saved');add(l.t45,s45+(l.t45===1?'':'s')+' taken');add(l.tow,'TO won');add(l.tol,'TO lost');
      add(l.fwon,'frees won');add(l.fcon,'frees given');add(l.save,l.save===1?'save':'saves');add(l.yellow,'yellow','y');add(l.black,'black');add(l.red,'red','rd')}
    return ps.join('')};
  app.innerHTML=`<div class="banner"><b>Demo.</b> Real 2026 results; the player and their stats are invented examples.</div>
  <section class="hero">
    <div class="who"><div class="num">${esc(d.player.num)}</div><div><b>${esc(d.player.name||'Player')}</b><span>${esc(d.squad)}</span></div></div>
    ${gg?`<div class="season"><b>${d.apps}</b><span>${d.apps===1?'match':'matches'} · ${d.mins} minutes played</span></div>`:`<div class="season"><b>${t.scoreG}-${pad(t.scoreP)}</b><span>season total · ${t.pts} pts</span></div>`}
  </section>
  <section class="panel"><div class="kpis">
    <div class="kpi hi"><b>${d.apps}</b><span>Appearances</span></div>
    <div class="kpi"><b>${d.mins}</b><span>Minutes played</span></div>
    ${gg?'':`<div class="kpi am"><b>${shotsTaken?Math.round(scoresN*100/shotsTaken)+'%':'–'}</b><span>Shots scored (${scoresN}/${shotsTaken})</span></div>
    ${arc?`<div class="kpi"><b>${t.two}/${t.twoAtt}</b><span>2-pointers scored/tried</span></div>`:''}
    <div class="kpi"><b>${t.s45}/${t.t45}</b><span>${s45}s scored/taken</span></div>
    <div class="kpi"><b>${t.fromFree}</b><span>Scores from frees</span></div>
    <div class="kpi"><b>${t.tow}–${t.tol}</b><span>Turnovers won–lost</span></div>
    ${t.save?`<div class="kpi"><b>${t.save}</b><span>Saves</span></div>`:''}
    <div class="kpi"><b>${t.yellow}/${d.code==='football'?t.black+'/':''}${t.red}</b><span>Cards Y/${d.code==='football'?'B/':''}R</span></div>`}
  </div>${gg?'<p class="legend">Go Games are non-competitive, so no scores are recorded. Every child gets game time.</p>':''}</section>
  ${!gg&&d.shots.length?`<section class="panel"><h3>My shot map</h3><div class="pitchbox">${pitchSVG(d.code,arc,d.shots)}</div>
    <div class="pkey"><span><i class="g"></i>Goal</span><span><i class="s"></i>Point</span>${arc?'<span><i class="two"></i>2-pointer</span>':''}<span><i class="m"></i>Missed</span></div></section>`:''}
  ${d.leaderboard?`<section class="panel"><h3>Team leaderboard</h3><div class="tw"><table><thead><tr><th>Player</th><th>Apps</th><th>Mins</th><th>Score</th></tr></thead><tbody>
    ${d.leaderboard.sort((a,b)=>b.pts-a.pts||b.mins-a.mins).map(r=>`<tr class="${r.me?'meRow':''}"><td>#${r.num} ${esc(r.name)}</td><td>${r.apps}</td><td>${r.mins}</td><td>${r.g}-${pad(r.p)}</td></tr>`).join('')}</tbody></table></div>
    <p class="legend">The coach chooses whether players can see the team leaderboard.</p></section>`:''}
  <section class="panel"><h3>Match by match</h3>
    ${d.matches.length?d.matches.map(g=>{const k=g.result?(g.result.us.t>g.result.them.t?'W':g.result.us.t<g.result.them.t?'L':'D'):null;
      return `<div class="game"><div class="o"><b>v ${esc(g.opp)}</b><span>${new Date(g.date+'T12:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'})}${g.comp?' · '+esc(g.comp):''}</span></div>
      <div class="r">${g.result?`${OG.fmt(g.result.us)} – ${OG.fmt(g.result.them)}<span class="w-${k}">${g.final?(k==='W'?'Won':k==='L'?'Lost':'Draw'):'In progress'}</span>`:'<span>Go Games</span>'}</div><div class="line">${line(g)}</div></div>`}).join(''):'<p class="empty">No matches yet.</p>'}
  </section>
  <section class="panel joinbox"><h3>Membership</h3><p class="legend">Club membership is on Foireann.</p>${joinRow(d.settings)}</section>
  <div class="row"><button class="btn" id="out">Not you? Use a different code</button></div>`;
  document.getElementById('out').onclick=()=>{st.set('');err='';try{history.replaceState(null,'',location.pathname)}catch(e){}vCode()};
}
document.getElementById('badge').innerHTML=`<img src="${OWN_BADGE}" alt="">`;
const q=clean(new URLSearchParams(location.search).get('code'));

if(saved)look(saved);else vCode();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window.self)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
